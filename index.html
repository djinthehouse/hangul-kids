<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131F24" media="(prefers-color-scheme: dark)">
<meta name="description" content="유아·초등 저학년을 위한 한글 놀이 — 따라 쓰기(획순), 글자 만들기, 그림 낱말, 듣고 말하기. 하트도 순위도 없이, 칭찬 스티커를 모아요. 부모님 화면과 하루 놀이 시간 제한.">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한글 놀이터">
<meta property="og:title" content="한글 놀이터 — 아이와 함께하는 한글 놀이">
<meta property="og:description" content="따라 쓰고, 만들고, 듣고, 말하며 익히는 한글. 유아·초등 저학년.">
<meta property="og:type" content="website">
<title>한글 놀이터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Jua&family=Fredoka:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* ---- tokens: light (default) ---- */
:root{
  --paper:#EFF4F7;
  --paper-2:#FFFFFF;
  --paper-3:#E0E9EF;
  --line:#CFDBE3;
  --ink:#16212E;
  --ink-2:#465768;
  --ink-3:#7D8E9E;
  --ai:#16607F;
  --ai-2:#1E7EA4;
  --ai-soft:#DDEDF4;
  --shu:#EF6B45;
  --shu-2:#C74C2A;
  --shu-soft:#FDEAE2;
  --gold:#B8871B;
  --stone:#C2D0D9;
  --on-accent:#FFFFFF;
  --band:#16607F;
  --band-2:#0E4459;
  --on-band:#FFFFFF;
  --drop:rgba(22,33,46,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101820;
    --paper-2:#18222C;
    --paper-3:#212D39;
    --line:#2E3D4B;
    --ink:#E8EEF3;
    --ink-2:#AFBECA;
    --ink-3:#7A8B99;
    --ai:#5FC0E0;
    --ai-2:#3E90B0;
    --ai-soft:#17303B;
    --shu:#FF8462;
    --shu-2:#C55839;
    --shu-soft:#33211B;
    --gold:#D6B155;
    --stone:#33424E;
    --on-accent:#0C141B;
    --band:#1B4E63;
    --band-2:#123745;
    --on-band:#D2ECF4;
    --drop:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#101820;
  --paper-2:#18222C;
  --paper-3:#212D39;
  --line:#2E3D4B;
  --ink:#E8EEF3;
  --ink-2:#AFBECA;
  --ink-3:#7A8B99;
  --ai:#5FC0E0;
  --ai-2:#3E90B0;
  --ai-soft:#17303B;
  --shu:#FF8462;
  --shu-2:#C55839;
  --shu-soft:#33211B;
  --gold:#D6B155;
  --stone:#33424E;
  --on-accent:#0C141B;
  --band:#1B4E63;
  --band-2:#123745;
  --on-band:#D2ECF4;
  --drop:rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
.jp{font-family:"Fredoka","Noto Sans KR",sans-serif;letter-spacing:.01em}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ---------------- top bar ---------------- */
.topbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line);padding:12px 18px;
  display:flex;align-items:center;gap:14px;
}
.stat{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700}
.stat svg{width:19px;height:19px;display:block}
.stat.streak{color:var(--shu)}
.stat.xp{color:var(--gold)}
.spacer{flex:1}
.iconbtn{
  background:none;border:1px solid var(--line);border-radius:9px;
  width:34px;height:34px;display:grid;place-items:center;padding:0;color:var(--ink-2);
}
.iconbtn svg{width:17px;height:17px}
.iconbtn:hover{background:var(--paper-3)}

/* ---------------- home ---------------- */
.hero{padding:28px 20px 6px;text-align:center}
.hero .seal{
  width:66px;height:66px;margin:0 auto 14px;border-radius:15px;
  background:var(--shu);color:var(--paper-2);display:grid;place-items:center;
  font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:32px;font-weight:700;
  box-shadow:0 6px 0 var(--shu-2);transform:rotate(-4deg);
}
.hero h1{margin:0;font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:26px;font-weight:700;letter-spacing:.05em}
.hero .tag{margin:8px 0 0;color:var(--ink-3);font-size:12.5px;letter-spacing:.02em}

.path{padding:6px 18px 44px}
.unitband{
  margin:26px 0 2px;padding:14px 16px;border-radius:14px;
  background:var(--band);color:var(--on-band);
  box-shadow:0 4px 0 var(--band-2);display:flex;align-items:center;gap:13px;
}
.unitband .num{
  font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:22px;opacity:.6;line-height:1;
  border-right:1px solid currentColor;padding-right:13px;
}
.unitband .ub-t{flex:1;min-width:0}
.unitband .t{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:16px;font-weight:700;line-height:1.35}
.gbtn{flex:none;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);
  color:var(--on-band);border-radius:9px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.gbtn:active{transform:translateY(1px)}

.gwrap{min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.gtop{flex:1;padding:34px 22px 20px;overflow-y:auto}
.gkicker{color:var(--ink-3);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.gtitle{font-size:22px;line-height:1.35;margin:10px 0 0;letter-spacing:-.3px}
.gbody{color:var(--ink-2);font-size:14.5px;line-height:1.75;margin:12px 0 0}
.gexlist{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.gex{border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--paper-2);cursor:pointer}
.gex:active{transform:translateY(1px)}
.gj{font-size:18px;line-height:1.5}
.gm{color:var(--ink-2);font-size:13px;margin-top:5px;line-height:1.5}
.bksec{margin-top:26px}
.bklab{font-weight:800;font-size:14px;color:var(--ink)}
.bkmeta{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.bkbox{width:100%;box-sizing:border-box;margin-top:9px;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--paper-2);color:var(--ink-2);font-size:11.5px;line-height:1.55;
  resize:vertical;word-break:break-all}
.bkrow{display:flex;gap:9px;margin-top:9px;flex-wrap:wrap}
.bkbtn{border:1.5px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:11px;
  padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.bkbtn:active{transform:translateY(1px)}
.bkbtn.danger{border-color:var(--shu);color:var(--shu)}
.bkmsg{color:var(--ink-3);font-size:12px;margin-top:8px;line-height:1.55}
.bkmsg.bad{color:var(--shu)}
.authwarn{margin-top:22px;padding:13px 15px;border-radius:13px;border:1.5px solid var(--shu);
  background:var(--shu-soft);color:var(--ink);font-size:12.5px;line-height:1.65}
.acctrow{display:flex;align-items:center;gap:10px;margin:4px 0 2px;padding:12px 14px;
  border:1.5px solid var(--line);border-radius:14px;background:var(--paper-2)}
.acctrow .who{flex:1;min-width:0}
.acctrow .nm{font-weight:800;font-size:13.5px;color:var(--ink)}
.acctrow .st{color:var(--ink-3);font-size:11.5px;margin-top:2px;line-height:1.45}
.acctrow .act{flex:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:10px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.acctrow .act:active{transform:translateY(1px)}
.homefoot{padding:34px 20px 30px;text-align:center}
.finishwrap{justify-content:flex-start;padding:0;min-height:100dvh}
.finishinner{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:34px 24px 20px;text-align:center;max-width:460px;margin:0 auto;width:100%;box-sizing:border-box}
.finishwrap .gfoot{width:100%;max-width:460px;margin:0 auto;box-sizing:border-box}
.fnstamp{display:inline-block;background:var(--shu);color:#fff;font-family:"Fredoka","Noto Sans KR",sans-serif;
  font-size:26px;line-height:1;padding:16px 14px;border-radius:16px;box-shadow:0 5px 0 var(--shu-2);
  letter-spacing:.08em;writing-mode:horizontal-tb}
.fntitle{font-size:24px;margin:22px 0 0;letter-spacing:-.4px}
.fnsub{color:var(--ink-2);font-size:14px;line-height:1.7;margin:10px 0 0}
.fnstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:26px 0 0}
.fnstat{border:1.5px solid var(--line);border-radius:14px;padding:13px 10px;background:var(--paper-2)}
.fnstat .k{color:var(--ink-3);font-size:11.5px}
.fnstat .v{font-size:21px;font-weight:800;margin-top:4px;color:var(--ink)}
.fnnote{color:var(--ink-3);font-size:12.5px;line-height:1.7;margin:22px 0 0}
.bklink{background:none;border:none;color:var(--ink-3);font:inherit;font-size:12.5px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.gfoot{padding:14px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.unitband .s{font-size:12px;opacity:.75;margin-top:3px}

.lessons{position:relative;padding:16px 0 8px}
.lessons::before{
  content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;transform:translateX(-1px);
  background:repeating-linear-gradient(var(--stone) 0 5px,transparent 5px 11px);
}
.node-row{
  position:relative;z-index:1;display:grid;grid-template-columns:1fr 78px 1fr;
  align-items:center;padding:9px 0;
}
.lab{font-size:12px;color:var(--ink-3);line-height:1.35}
.lab.l{text-align:right;padding-right:16px}
.lab.r{text-align:left;padding-left:16px}
.nodecell{display:grid;place-items:center}
.node{
  position:relative;width:70px;height:70px;border:0;padding:0;border-radius:50%;
  background:var(--stone);color:var(--paper);display:grid;place-items:center;
  font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:26px;font-weight:700;
  box-shadow:0 5px 0 var(--drop), 0 0 0 8px var(--paper);
  transition:transform .12s ease, box-shadow .12s ease;
}
.node:not(:disabled):active{transform:translateY(4px) translateX(var(--off,0));box-shadow:0 1px 0 var(--drop), 0 0 0 8px var(--paper)}
.node{transform:translateX(var(--off,0))}
.node.open{background:var(--paper-2);color:var(--ai);box-shadow:0 5px 0 var(--ai-2), 0 0 0 8px var(--paper), inset 0 0 0 3px var(--ai)}
.node.done{background:var(--shu);color:var(--paper-2);box-shadow:0 5px 0 var(--shu-2), 0 0 0 8px var(--paper)}
.node.current{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(var(--off,0)) translateY(0)}50%{transform:translateX(var(--off,0)) translateY(-5px)}}
.node .stars{
  position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  display:flex;gap:3px;background:var(--paper);padding:3px 6px;border-radius:20px;border:1px solid var(--line);
}
.node .stars i{width:5px;height:5px;border-radius:50%;background:var(--stone);display:block}
.node .stars i.on{background:var(--gold)}
.node-row.locked{opacity:.5}
.node:disabled{cursor:default}

/* ---------------- lesson chrome ---------------- */
.lessonbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  padding:12px 16px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);
}
.bar{flex:1;height:13px;border-radius:20px;background:var(--paper-3);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:20px;background:var(--shu);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.hearts{display:flex;gap:3px;align-items:center}
.hearts svg{width:20px;height:20px;display:block}
.hearts .h{color:var(--shu);transition:transform .2s,opacity .2s}
.hearts .h.off{color:var(--stone);opacity:.55;transform:scale(.82)}
.hearts .h.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.4)}100%{transform:scale(.82)}}

.stage{flex:1;padding:24px 20px 200px;display:flex;flex-direction:column}
.prompt-label{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ink-3);margin-bottom:18px}
.combo{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--shu);
  background:var(--shu-soft);padding:3px 9px;border-radius:20px;margin-left:9px;letter-spacing:.02em;
}
.combo svg{width:11px;height:11px}
.qjp{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:33px;font-weight:600;line-height:1.5;letter-spacing:.02em;text-wrap:balance}
.qkana{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:15px;color:var(--ink-3);margin-top:7px;letter-spacing:.1em}
.qko{font-size:24px;font-weight:700;line-height:1.5;text-wrap:balance;word-break:keep-all}
.qhint{font-size:13px;color:var(--ink-3);margin-top:12px;line-height:1.6}

.speaker{
  display:inline-flex;align-items:center;gap:9px;background:var(--ai);color:var(--on-accent);
  border:0;border-radius:14px;padding:13px 19px;font-weight:700;font-size:14px;
  box-shadow:0 4px 0 var(--ai-2);
}
.speaker:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ai-2)}
.speaker svg{width:21px;height:21px}
.speaker.big{padding:24px 30px;font-size:16px;border-radius:18px}
.speaker.big svg{width:32px;height:32px}
.sayrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.speaker.slow{
  background:var(--paper-2);color:var(--ai);border:1.5px solid var(--line);
  border-bottom-width:4px;box-shadow:none;padding:11px 15px;font-size:13px;
}
.speaker.slow:active{transform:translateY(2px);border-bottom-width:2px}
.speaker.slow svg{width:19px;height:19px}
/* 눌러서 들을 수 있는 영어 — 살짝 밑줄을 둡니다 */
.qjp.tappable{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;
  text-decoration-color:var(--stone);text-underline-offset:8px}
.qjp.tappable:active{opacity:.6}
.fb-say{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;vertical-align:middle;
  background:transparent;border:0;padding:2px 6px;margin-left:6px;color:var(--ai);
}
.fb-say svg{width:20px;height:20px}
.fb-say:active{opacity:.55}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.opt{
  text-align:left;background:var(--paper-2);border:1.5px solid var(--line);border-bottom-width:4px;
  border-radius:14px;padding:15px 16px;font-size:16px;font-weight:500;
  transition:background .12s,border-color .12s,color .12s;
}
.opt.jp{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:20px;font-weight:600}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.opt.sel{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.opt.right{background:var(--shu-soft);border-color:var(--shu);color:var(--shu)}

/* 보기를 누르면 소리와 함께 살짝 튀어 오릅니다 */
.opt.saying{animation:optsay .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes optsay{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){ .opt.saying{animation:none} }
.opt.wrong{background:var(--paper-3);border-color:var(--ink-3);color:var(--ink-3);text-decoration:line-through}

.answerline{
  margin-top:26px;min-height:60px;padding:9px 0;
  border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);
  display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
}
.answerline.second{border-top:0;margin-top:0;min-height:52px}
.bank{margin-top:24px;display:flex;flex-wrap:wrap;gap:9px}
.tok{
  background:var(--paper-2);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:11px;
  padding:9px 13px;font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:19px;font-weight:600;
}
.tok:active{transform:translateY(2px);border-bottom-width:2px}
.tok.ghost{opacity:.25;pointer-events:none;border-style:dashed}

.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.mcard{
  background:var(--paper-2);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:13px;
  padding:15px 8px;min-height:66px;display:grid;place-items:center;text-align:center;
  font-size:15px;font-weight:600;line-height:1.35;word-break:keep-all;transition:opacity .2s,transform .2s,background .12s,border-color .12s,color .12s;
}
.mcard.jpc{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:20px}
.mcard.sel{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.mcard.gone{opacity:0;pointer-events:none;transform:scale(.88)}
.mcard.bad{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.spellbox{
  width:100%;margin-top:26px;background:var(--paper-2);color:var(--ink);
  border:1.5px solid var(--line);border-bottom:2.5px solid var(--ai);border-radius:12px;
  font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:27px;font-weight:500;letter-spacing:.03em;
  padding:14px 16px;text-align:center;outline:none;
}
.spellbox::placeholder{color:var(--ink-3);font-size:19px;letter-spacing:0}
.spellbox:focus{border-color:var(--ai);box-shadow:0 0 0 3px var(--ai-soft)}
.spellbox:disabled{opacity:1}

/* ---------------- footer + feedback ---------------- */
.footer{
  position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--paper);
  border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom));
}
.footer-inner{max-width:440px;margin:0 auto}
.cta{
  width:100%;border:0;border-radius:15px;padding:16px;font-size:16px;font-weight:900;letter-spacing:.02em;
  background:var(--ai);color:var(--on-accent);box-shadow:0 5px 0 var(--ai-2);
}
.cta.shu{background:var(--shu);box-shadow:0 5px 0 var(--shu-2)}
.cta.ghost{background:var(--paper-3);color:var(--ink-2);box-shadow:0 5px 0 var(--line)}
.cta:disabled{background:var(--paper-3);color:var(--ink-3);box-shadow:0 5px 0 var(--line);cursor:not-allowed}
.cta:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 var(--drop)}

.feedback{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  transform:translateY(115%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding:18px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid transparent;
}
.feedback.show{transform:translateY(0)}
.feedback.ok{background:var(--shu-soft);border-color:var(--shu)}
.feedback.no{background:var(--ai-soft);border-color:var(--ai)}
.fb-inner{max-width:440px;margin:0 auto;display:flex;gap:14px;align-items:flex-start}
.fb-mark{flex:none;position:relative;width:58px}
.fb-badge{
  position:absolute;right:-8px;bottom:-4px;width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:14px;font-weight:700;
  color:var(--paper-2);box-shadow:0 0 0 3px var(--paper-2);
}
.feedback.ok .fb-badge{background:var(--shu);box-shadow:0 0 0 3px var(--shu-soft)}
.feedback.no .fb-badge{background:var(--ai);box-shadow:0 0 0 3px var(--ai-soft)}
.fb-text{flex:1;min-width:0}
.fb-title{font-size:16px;font-weight:900;margin-bottom:4px;color:var(--ink)}
.fb-body{font-size:14px;color:var(--ink-2);line-height:1.55;word-break:keep-all}
.fb-body b{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:17px;color:var(--ink);font-weight:600}
.feedback .footer-inner{margin-top:14px}

/* ---------------- result ---------------- */
.center-screen{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:36px 24px 44px;text-align:center}
.bigseal{
  width:112px;height:112px;border-radius:50%;display:grid;place-items:center;
  font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:46px;font-weight:700;
  border:5px solid var(--shu);color:var(--shu);margin-bottom:24px;
  animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes stamp{0%{transform:scale(2) rotate(-16deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.bigseal.fail{border-color:var(--ink-3);color:var(--ink-3)}
.center-screen h2{margin:0 0 8px;font-size:23px;font-weight:900}
.center-screen .sub{color:var(--ink-3);font-size:13.5px;margin:0 0 26px;line-height:1.7;word-break:keep-all}
.scorecards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;margin-bottom:24px}
.scard{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper-2)}
.scard .h{font-size:10px;font-weight:900;letter-spacing:.1em;padding:6px 2px;color:var(--on-accent);background:var(--ai)}
.scard.gold .h{background:var(--gold)}
.scard.shu .h{background:var(--shu)}
.scard .v{padding:11px 4px;font-family:"Roboto Mono",monospace;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;color:var(--ink-3);font-size:13px;font-weight:700;padding:16px;text-decoration:underline}
.review{width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:22px;background:var(--paper-2)}
.review h3{margin:0 0 11px;font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.review ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.review li{display:flex;gap:11px;align-items:baseline;font-size:14px}
.review li .j{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:17px;font-weight:600;flex:none}
.review li .k{color:var(--ink-3);font-size:13px}

/* ---------------- sheet ---------------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);
  border-radius:20px 20px 0 0;padding:24px 22px calc(20px + env(safe-area-inset-bottom));
  max-width:480px;margin:0 auto;transform:translateY(115%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
}
.sheet.show{transform:translateY(0)}
.sheet h3{margin:0 0 8px;font-size:18px;font-weight:900}
.sheet p{margin:0 0 20px;color:var(--ink-3);font-size:14px;line-height:1.65;word-break:keep-all}

/* ---------------- mascot, particles, flourishes ---------------- */
#petals,#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#petals{z-index:0}
#fxc{z-index:44}
#app{position:relative;z-index:1}

.neko{display:block;width:100%;height:auto;overflow:visible}
.neko-idle{animation:nekobob 3.4s ease-in-out infinite}
@keyframes nekobob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.5deg)}}
.neko-happy{animation:nekojump .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes nekojump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-15px) scale(1.07)}60%{transform:translateY(0) scale(.97)}100%{transform:translateY(0) scale(1)}}
.neko-sad{animation:nekowob .6s ease-in-out}
@keyframes nekowob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.neko-cheer{animation:nekocheer 1.1s ease-in-out infinite}
@keyframes nekocheer{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}

.nekoblock{position:relative;margin:0 auto}
.nekoblock .stamp{
  position:absolute;right:-16px;bottom:10px;width:44px;height:44px;border-radius:12px;
  display:grid;place-items:center;font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:22px;font-weight:700;
  background:var(--shu);color:var(--paper-2);box-shadow:0 4px 0 var(--shu-2);transform:rotate(-6deg);
  animation:stampin .5s cubic-bezier(.2,1.5,.4,1) both;
}
.nekoblock .stamp.grey{background:var(--stone);color:var(--paper);box-shadow:0 4px 0 var(--line)}
@keyframes stampin{0%{transform:scale(2.2) rotate(-20deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}

.xpfloat{
  position:fixed;z-index:56;font-family:"Roboto Mono",monospace;font-weight:700;font-size:21px;
  color:var(--gold);pointer-events:none;animation:xpup 1.05s ease-out forwards;
  text-shadow:0 2px 6px var(--paper),0 0 2px var(--paper);
}
@keyframes xpup{
  0%{opacity:0;transform:translate(-50%,0) scale(.6)}
  22%{opacity:1;transform:translate(-50%,-16px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-72px) scale(1)}
}
.sndrow{display:flex;gap:7px}
.iconbtn.muted{opacity:.42}
.bar>i{position:relative;overflow:hidden}
.bar>i::after{
  content:"";position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  animation:sheen 2.6s linear infinite;
}
.node.justdone{animation:justdone .7s cubic-bezier(.2,1.5,.4,1)}
/* ================= 듀오링고식 장치: 하트 · 말풍선 · 보물상자 ================= */

/* ---- 상단 하트 ---- */
.stat.hp{color:var(--shu);cursor:pointer;-webkit-tap-highlight-color:transparent}
.stat.hp svg{width:18px;height:18px}
.stat.hp.low{opacity:.8}
.stat.hp.empty{color:var(--stone)}
.stat.hp .rc{font-size:11px;font-weight:700;color:var(--ink-3);margin-left:5px;letter-spacing:-.02em}
.stat.streak{cursor:pointer;-webkit-tap-highlight-color:transparent}
.stat.streak .fz{
  display:inline-grid;place-items:center;width:15px;height:15px;margin-left:2px;
  border-radius:50%;background:var(--ai-soft);color:var(--ai);font-size:9px;font-weight:900;
}

/* ---- 캐릭터가 건네는 한마디 ---- */
.hero .bubble{
  position:relative;margin:4px auto 14px;max-width:min(300px,86vw);
  background:var(--paper-2);color:var(--ink);border:2px solid var(--line);
  border-radius:16px;padding:10px 15px;font-size:13.5px;font-weight:700;line-height:1.5;
  box-shadow:0 4px 0 var(--drop);
  animation:bubin .55s cubic-bezier(.2,1.5,.4,1) both;
}
.hero .bubble::before,.hero .bubble::after{
  content:'';position:absolute;left:50%;width:0;height:0;border-style:solid;
}
.hero .bubble::before{top:-13px;transform:translateX(-50%);
  border-width:0 10px 13px;border-color:transparent transparent var(--line)}
.hero .bubble::after{top:-10px;transform:translateX(-50%);
  border-width:0 8px 11px;border-color:transparent transparent var(--paper-2)}
@keyframes bubin{0%{opacity:0;transform:translateY(-7px) scale(.93)}100%{opacity:1;transform:none}}

/* ---- 놀이 중간에 캐릭터가 지나가며 하는 말 ---- */
.mtoast{
  position:fixed;left:50%;top:74px;z-index:72;transform:translate(-50%,-12px);
  display:flex;align-items:center;gap:9px;max-width:min(330px,90vw);
  background:var(--band);color:var(--on-band);border-radius:999px;
  padding:7px 17px 7px 8px;font-size:13px;font-weight:800;line-height:1.3;
  box-shadow:0 8px 24px var(--drop);opacity:0;pointer-events:none;
  transition:opacity .28s ease, transform .28s cubic-bezier(.2,1.5,.4,1);
}
.mtoast.show{opacity:1;transform:translate(-50%,0)}
.mtoast .mh{
  width:31px;height:31px;flex:0 0 31px;border-radius:50%;overflow:hidden;
  background:var(--paper);display:grid;place-items:center;
}
.mtoast .mh img{width:100%;height:100%;object-fit:cover;display:block}

/* ---- 단원 끝의 보물상자 ---- */
.node.chest{
  background:var(--gold);color:#fff;
  box-shadow:0 5px 0 var(--drop), 0 0 0 8px var(--paper);
  animation:chestwob 1.9s ease-in-out infinite;
}
.node.chest.got{
  background:var(--paper-3);color:var(--ink-3);animation:none;
  box-shadow:0 5px 0 var(--drop), 0 0 0 8px var(--paper);
}
@keyframes chestwob{
  0%,58%,100%{transform:translateX(var(--off,0)) rotate(0)}
  64%{transform:translateX(var(--off,0)) rotate(-7deg)}
  72%{transform:translateX(var(--off,0)) rotate(7deg)}
  80%{transform:translateX(var(--off,0)) rotate(-4deg)}
}
.chestlab{font-size:12px;font-weight:800;color:var(--gold);line-height:1.35;text-align:left;padding-left:16px}
.chestlab.got{color:var(--ink-3);font-weight:700}
/* ================= 말하기 · 이야기 · 리그 ================= */

/* ---- 말하기 ---- */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:30px 0 8px}
.micbtn{
  width:96px;height:96px;border-radius:50%;border:0;padding:0;
  background:var(--shu);color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 6px 0 var(--shu-2), 0 0 0 10px var(--shu-soft);
  transition:transform .12s ease, box-shadow .12s ease;
}
.micbtn svg{width:44px;height:44px;display:block}
.micbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shu-2), 0 0 0 10px var(--shu-soft)}
.micbtn.on{animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{
  0%,100%{box-shadow:0 6px 0 var(--shu-2), 0 0 0 10px var(--shu-soft)}
  50%{box-shadow:0 6px 0 var(--shu-2), 0 0 0 22px var(--shu-soft)}
}
.michint{font-size:13.5px;font-weight:700;color:var(--ink-3);min-height:20px;text-align:center}
.simbar{margin-top:9px;height:8px;border-radius:99px;background:var(--paper-3);overflow:hidden}
.simbar>i{display:block;height:100%;border-radius:99px;background:var(--stone);transition:width .5s cubic-bezier(.2,1,.3,1)}
.simbar>i.g{background:var(--gold)}
.simbar>i.c{background:var(--ai)}
.simbar>i.n{background:var(--stone)}

/* ---- 이야기 ---- */
.storystage{padding-bottom:20px}
.storyhead{text-align:center;margin:2px 0 18px}
.storyhead .t{font-size:21px;font-weight:900;letter-spacing:-.01em}
.storyhead .s{font-size:13px;color:var(--ink-3);margin-top:3px}
.chat{display:flex;flex-direction:column;gap:13px;width:100%}
.crow{display:flex;flex-direction:column;max-width:86%}
.crow.l{align-self:flex-start;align-items:flex-start}
.crow.r{align-self:flex-end;align-items:flex-end}
.crow .cwho{font-size:11.5px;font-weight:800;color:var(--ink-3);margin:0 6px 3px}
.cbub{
  border:0;text-align:left;cursor:pointer;padding:12px 15px;border-radius:17px;
  background:var(--paper-2);box-shadow:0 2px 0 var(--drop);
  transition:transform .1s ease;
}
.cbub:active{transform:scale(.985)}
.crow.l .cbub{border-bottom-left-radius:5px}
.crow.r .cbub{border-bottom-right-radius:5px;background:var(--ai-soft)}
.cbub .ct{font-size:19px;font-weight:700;line-height:1.5;color:var(--ink)}
.cbub .ct b{color:var(--shu)}
.cbub .ck{font-size:12.5px;color:var(--ink-3);margin-top:2px;font-weight:600}
.cbub .cm{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.45;word-break:keep-all}
.crow.fresh .cbub{animation:chatin .42s cubic-bezier(.2,1.5,.4,1) both}
@keyframes chatin{0%{opacity:0;transform:translateY(9px) scale(.96)}100%{opacity:1;transform:none}}

.gapbox{margin-top:22px;width:100%}
.gapbox .gaph{font-size:13px;font-weight:800;color:var(--ink-3);margin-bottom:10px;text-align:center}
.gapopts{display:flex;flex-direction:column;gap:9px}
.gapopt{width:100%}

.storylist{margin:6px 20px 20px;background:var(--paper-2);border-radius:20px;padding:15px 15px 8px;box-shadow:0 3px 0 var(--drop)}
.storylist .slh{margin-bottom:11px}
.storylist .slh .t{font-size:16px;font-weight:900}
.storylist .slh .s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.srow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;
  padding:9px 2px;cursor:pointer;text-align:left;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .si{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;
  background:var(--ai);color:#fff;font-size:17px;font-weight:700}
.srow.done .si{background:var(--paper-3);color:var(--ink-3)}
.srow .sb{flex:1;min-width:0}
.srow .st{font-size:14.5px;font-weight:800;line-height:1.35}
.srow .ss{font-size:12px;color:var(--ink-3);margin-top:1px;line-height:1.35;word-break:keep-all}
.srow .sx{font-size:12px;font-weight:800;color:var(--gold);flex:0 0 auto}
.srow.done .sx{color:var(--ink-3)}
.slmore{font-size:12px;color:var(--ink-3);padding:9px 2px 4px;border-top:1px solid var(--line);line-height:1.45}

/* ---- 리그 ---- */
.lgcard{margin:6px 20px 16px;background:var(--paper-2);border-radius:20px;padding:15px;box-shadow:0 3px 0 var(--drop)}
.lgcard.join{display:flex;align-items:center;gap:12px}
.lgcard.join .lgh{flex:1;min-width:0}
.lgh{display:flex;align-items:center;gap:12px}
.lgh .t{font-size:16px;font-weight:900;line-height:1.3}
.lgh .s{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.4;word-break:keep-all}
.lgt{flex:1;min-width:0}
.lgbadge{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;
  color:#fff;font-size:19px;font-weight:800;box-shadow:0 3px 0 var(--drop)}
.lgbadge.big{width:74px;height:74px;flex:0 0 74px;border-radius:22px;font-size:34px;margin:0 auto 10px}
.lgbtn,.lgmore{border:0;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;
  background:var(--shu);color:#fff;flex:0 0 auto}
.lgmore{background:var(--paper-3);color:var(--ink-2);padding:7px 13px;font-size:12px}
.lgrows{margin-top:12px}
.lgrow{display:flex;align-items:center;gap:11px;padding:8px 4px;border-top:1px solid var(--line)}
.lgrow:first-child{border-top:0}
.lgrow .lgr{width:26px;flex:0 0 26px;text-align:center;font-size:13.5px;font-weight:900;color:var(--ink-3)}
.lgrow.up .lgr{color:var(--gold)}
.lgrow .lgn{flex:1;min-width:0;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgrow .lgx{font-size:13.5px;font-weight:800;color:var(--ink-2);flex:0 0 auto}
.lgrow.me{background:var(--ai-soft);border-radius:11px;border-top-color:transparent}
.lgrow.me .lgn{color:var(--ai)}
.lgme{font-size:10.5px;font-weight:900;background:var(--ai);color:#fff;border-radius:99px;padding:1px 6px;margin-left:5px}
.lgdots{text-align:center;color:var(--ink-3);font-size:14px;letter-spacing:.2em;padding:2px 0}
.lgnote{font-size:13px;color:var(--ink-3);padding:8px 2px;line-height:1.5;word-break:keep-all}
.lgmove{margin-top:10px;font-size:12.5px;font-weight:800;border-radius:11px;padding:8px 12px;line-height:1.45}
.lgmove.up{background:var(--gold);color:#fff}
.lgmove.down{background:var(--paper-3);color:var(--ink-2)}
.lgfull{padding:0 20px 40px}
.lgfull .lgrow{background:var(--paper-2);border-radius:13px;margin-bottom:7px;border-top:0;padding:11px 13px;box-shadow:0 2px 0 var(--drop)}
.lgfull .lgrow.me{background:var(--ai-soft)}
.lgrule{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:14px;word-break:keep-all}

.sheet .warn{color:var(--shu);font-weight:700}
.lglab{display:block;font-size:12.5px;font-weight:800;color:var(--ink-3);margin:14px 0 6px}
.lginput{
  width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:14px;
  padding:13px 15px;font-size:17px;font-weight:700;font-family:inherit;
  background:var(--paper);color:var(--ink);
}
.lginput:focus{outline:0;border-color:var(--ai)}
.lgerr{color:var(--shu);font-size:12.5px;font-weight:700;min-height:18px;margin:6px 0 10px}
/* ================= 3탄: 스트릭 화면 · 온보딩 · 말하기 · 받아쓰기 · 보석 · 상점 · PWA ================= */

/* ---- 스트릭 축하 ---- */
.stkscreen{
  position:fixed;inset:0;z-index:90;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 22px calc(26px + env(safe-area-inset-bottom));text-align:center;
  opacity:0;transform:scale(1.04);transition:opacity .25s ease, transform .3s cubic-bezier(.2,1.2,.4,1);
}
.stkscreen.show{opacity:1;transform:none}
.stkscreen .stkglow{
  position:absolute;left:50%;top:30%;width:min(120vw,560px);aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side, var(--shu-soft) 0%, transparent 72%);
}
.stkscreen.mile .stkglow{background:radial-gradient(closest-side, rgba(224,179,74,.42) 0%, transparent 72%)}
.stkscreen>*{position:relative}
.stkflame{width:120px;height:120px;color:var(--shu);transition:transform .5s cubic-bezier(.2,1.8,.4,1)}
.stkflame svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 18px rgba(239,107,69,.35))}
.stkflame.big{transform:scale(1.18)}
.stkscreen.mile .stkflame{color:var(--gold)}
.stknum{font-size:88px;font-weight:900;line-height:1;color:var(--shu);margin-top:6px;letter-spacing:-.03em}
.stkscreen.mile .stknum{color:var(--gold)}
.stknum.pop{animation:stkpop .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes stkpop{0%{transform:scale(.4) translateY(20px);opacity:.2}60%{transform:scale(1.2)}100%{transform:none;opacity:1}}
.stklab{font-size:21px;font-weight:900;margin-top:6px}
.stkweek{display:flex;gap:9px;margin:26px 0 8px}
.stkweek .d{display:flex;flex-direction:column;align-items:center;gap:6px}
.stkweek .dot{width:34px;height:34px;border-radius:50%;background:var(--paper-3);display:grid;place-items:center;
  color:#fff;font-size:15px;font-weight:900;transition:background .3s,transform .4s cubic-bezier(.2,1.8,.4,1)}
.stkweek .d.on .dot{background:var(--shu)}
.stkweek .d.now .dot{box-shadow:0 0 0 3px var(--shu-soft)}
.stkweek .d.now.on .dot{transform:scale(1.15)}
.stkweek .lb{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.stkmsg{font-size:15px;color:var(--ink-2);line-height:1.55;max-width:320px;margin:14px 0 26px;word-break:keep-all}
.stkscreen .cta{width:min(100%,420px)}

/* ---- 온보딩 ---- */
.obwrap{padding:14px 20px 40px;max-width:560px;margin:0 auto}
.obtop{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:18px}
.obdots{display:flex;gap:6px;justify-content:center}
.obdots i{width:26px;height:6px;border-radius:99px;background:var(--paper-3)}
.obdots i.on{background:var(--shu)}
.obq{font-size:24px;font-weight:900;letter-spacing:-.01em;margin:8px 0 20px;text-align:center}
.obopts{display:flex;flex-direction:column;gap:10px}
.obopt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--paper-2);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;
  padding:14px 16px;font-size:16px;font-weight:800;color:var(--ink);
  transition:transform .1s ease, border-color .15s, background .15s;
}
.obopt:active{transform:translateY(2px);border-bottom-width:2px}
.obopt.sel{border-color:var(--ai);background:var(--ai-soft)}
.obopt.rec{border-color:var(--gold)}
.obopt .oi{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;

/* ---- 리액션: 색 무대 · 콤보 · 화면 흔들림 ---- */
/* 캐릭터가 검정·흰색 위주라 화면에서 묻힙니다. 뒤에 색 무대를 깔아 줍니다. */
.nekoblock::after{
  content:'';position:absolute;left:50%;top:52%;z-index:0;
  width:min(152%,68vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side, var(--shu-soft) 0%, var(--shu-soft) 56%, transparent 78%);
}
.nekoblock.party::after{
  background:radial-gradient(closest-side, var(--gold) 0%, transparent 70%);opacity:.34;
}
@supports (color: color-mix(in srgb, red 50%, transparent)){
  .nekoblock::after{background:radial-gradient(closest-side,
      color-mix(in srgb, var(--shu) 38%, transparent) 0%,
      color-mix(in srgb, var(--shu) 26%, transparent) 56%, transparent 78%)}
  .nekoblock.party::after{background:radial-gradient(closest-side, color-mix(in srgb, var(--gold) 62%, transparent) 0%, transparent 70%);opacity:1}
}
.nekoblock>*{position:relative;z-index:1}
/* 완주 순간에만 도는 빛살 — SVG 라 브라우저를 가리지 않습니다 */
.nekoblock>.rays{
  position:absolute;left:50%;top:47%;z-index:0;pointer-events:none;overflow:visible;
  width:min(205%,82vw);aspect-ratio:1;transform:translate(-50%,-50%);
}
.nekoblock .rays .spin{transform-origin:50% 50%;animation:rayspin 22s linear infinite}
@keyframes rayspin{to{transform:rotate(360deg)}}

/* 콤보가 쌓일수록 눈에 띄게 */
.combo{transition:background .2s,color .2s,box-shadow .2s}
.combo.hot{background:var(--gold);color:#fff}
.combo.fire{background:var(--shu);color:#fff;box-shadow:0 0 0 3px var(--shu-soft)}
.combo.bump{animation:combobump .36s cubic-bezier(.2,1.7,.4,1)}
@keyframes combobump{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}

/* 화면 한가운데 크게 뜨는 칭찬 */
.cheerpop{
  position:fixed;left:50%;top:36%;z-index:70;pointer-events:none;white-space:nowrap;
  font-size:26px;font-weight:900;letter-spacing:-.01em;
  background:var(--band);color:var(--on-band);border-radius:999px;padding:13px 26px;
  box-shadow:0 12px 34px var(--drop);opacity:0;
  animation:cheerpop 1.2s cubic-bezier(.2,1.5,.4,1) forwards;
}
.cheerpop.gold{background:var(--gold);color:#fff}
.cheerpop.shu{background:var(--shu);color:#fff}
@keyframes cheerpop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-7deg)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.14) rotate(3deg)}
  34%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  76%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-86%) scale(.93)}
}

/* 하트를 잃을 때 화면이 붉게 번쩍 */
.hitflash{
  position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center, transparent 34%, rgba(216,64,42,.5) 100%);
  animation:hitflash .5s ease-out forwards;
}
@keyframes hitflash{0%{opacity:0}16%{opacity:1}100%{opacity:0}}

.shakeit{animation:bigshake .44s cubic-bezier(.36,.07,.19,.97)}
@keyframes bigshake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.nudge{animation:nudgeup .32s ease-out}
@keyframes nudgeup{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}

/* 채점 줄의 캐릭터 얼굴이 더 크게 반응하도록 */
.fb-mark .neko-happy{animation:markpop .52s cubic-bezier(.2,1.8,.4,1)}
.fb-mark .neko-sad{animation:markwob .52s ease-in-out}
@keyframes markpop{0%{transform:scale(.4) rotate(-14deg)}55%{transform:scale(1.24) rotate(7deg)}100%{transform:scale(1) rotate(0)}}
@keyframes markwob{0%,100%{transform:rotate(0)}20%{transform:rotate(-11deg)}60%{transform:rotate(10deg)}}

/* 완주 화면의 승급·목표 달성 한 줄을 알약으로 도드라지게 */
.center-screen .sub.win{

  padding:9px 18px;font-weight:800;font-size:14.5px;box-shadow:0 6px 18px var(--drop);
  animation:winpop .6s cubic-bezier(.2,1.6,.4,1) both;
}

@keyframes winpop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

.srscard{margin:4px 0 2px;padding:15px 16px;border-radius:16px;border:1.5px solid var(--line);
  background:var(--paper-2);display:flex;align-items:center;gap:12px}

  font-size:14px;color:var(--on-accent);background:var(--shu);box-shadow:0 3px 0 var(--shu-2);cursor:pointer}
.srsbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shu-2)}
.trackhead .tt{color:var(--ink)}

  border-radius:11px;padding:8px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;line-height:1.2}
.trackbtn:active{transform:translateY(1px)}

/* ================= 듀오링고식 화면 ================= */
:root{
  --du-green:#58CC02; --du-green-d:#58A700; --du-green-soft:#D7FFB8; --du-green-line:#A5ED6E;
  --du-red:#FF4B4B;   --du-red-d:#EA2B2B;   --du-red-soft:#FFDFE0;   --du-red-line:#FFB2B2;
  --du-blue:#1CB0F6;  --du-blue-d:#1899D6;  --du-blue-soft:#DDF4FF;  --du-blue-line:#84D8FF;
  --du-gray:#E5E5E5;  --du-gray-d:#AFAFAF;  --du-line:#E5E5E5;
  --paper:#FFFFFF; --paper-2:#FFFFFF; --paper-3:#F2F2F2; --line:#E5E5E5; --stone:#E5E5E5;
  --ink:#3C3C3C; --ink-2:#4B4B4B; --ink-3:#777777; --drop:#E5E5E5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --du-green-soft:#1F3417; --du-green-line:#3E6B1F; --du-red-soft:#3B2226; --du-red-line:#7A3036;
    --du-blue-soft:#15313F; --du-blue-line:#1F6E93; --du-gray:#37464F; --du-gray-d:#6F828C; --du-line:#37464F;
    --paper:#131F24; --paper-2:#131F24; --paper-3:#1F2E35; --line:#37464F; --stone:#37464F;
    --ink:#F1F7FB; --ink-2:#DCE6EC; --ink-3:#9DB0BB; --drop:#37464F;
  }
}
:root[data-theme="dark"]{
  --du-green-soft:#1F3417; --du-green-line:#3E6B1F; --du-red-soft:#3B2226; --du-red-line:#7A3036;
  --du-blue-soft:#15313F; --du-blue-line:#1F6E93; --du-gray:#37464F; --du-gray-d:#6F828C; --du-line:#37464F;
  --paper:#131F24; --paper-2:#131F24; --paper-3:#1F2E35; --line:#37464F; --stone:#37464F;
  --ink:#F1F7FB; --ink-2:#DCE6EC; --ink-3:#9DB0BB; --drop:#37464F;
}

/* ---- 버튼 ---- */
.cta{background:var(--du-green);color:#fff;box-shadow:0 4px 0 var(--du-green-d);border-radius:16px;font-weight:900;letter-spacing:.03em}
.cta.shu{background:var(--du-green);box-shadow:0 4px 0 var(--du-green-d)}
.cta.ghost{background:var(--paper);color:var(--du-blue-d);border:2px solid var(--du-line);box-shadow:0 4px 0 var(--du-line)}
.cta:disabled{background:var(--du-gray);color:var(--du-gray-d);box-shadow:none}
.cta:not(:disabled):active{transform:translateY(4px);box-shadow:none}
.linkbtn{color:var(--du-blue-d);font-weight:800}

/* ---- 윗줄 ---- */
.topbar.du-top{justify-content:space-between;gap:6px;border-bottom:2px solid var(--du-line);padding:10px 16px}
.topbar.du-top .spacer{display:none}
.du-flag{width:36px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:14px;
  color:#fff;background:var(--band);box-shadow:0 3px 0 var(--band-2);font-family:"Noto Sans KR","Noto Sans JP",sans-serif}
.topbar.du-top .stat{font-size:16px;font-weight:900;gap:6px;padding:6px 8px;border-radius:12px}
.topbar.du-top .stat svg{width:24px;height:24px}
.topbar.du-top .stat.gem{color:var(--du-blue)}
.topbar.du-top .stat.hp{color:var(--du-red)}
.topbar.du-top .stat.streak{color:#FF9600}

/* ---- 아래 탭 ---- */
.du-spacer{height:92px}
.du-tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;max-width:480px;margin:0 auto;display:flex;gap:2px;
  background:var(--paper);border-top:2px solid var(--du-line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.du-tab{flex:1;min-width:0;border:2px solid transparent;background:none;border-radius:12px;padding:4px 0 3px;display:flex;
  flex-direction:column;align-items:center;gap:1px;position:relative;font-size:11px;font-weight:800;color:var(--ink-3)}
.du-tab svg{width:30px;height:30px;display:block}
.du-tab.on{border-color:var(--du-blue-line);background:var(--du-blue-soft);color:var(--du-blue-d)}
.du-tab .dot{position:absolute;top:3px;left:calc(50% + 8px);width:11px;height:11px;border-radius:50%;background:var(--du-red);border:2px solid var(--paper)}
.du-tab:active{transform:translateY(1px)}

.du-pane{padding:0 16px}
.du-pane[hidden]{display:none}
.du-learn{padding:0}
.du-ph h2{font-size:24px;font-weight:900;margin:22px 0 4px;color:var(--ink)}
.du-ph p{margin:0 0 16px;color:var(--ink-3);font-size:14px;line-height:1.5;word-break:keep-all}
.du-h3,.du-set h3{font-size:18px;font-weight:900;margin:22px 0 10px;color:var(--ink)}
.du-pane .lgcard,.du-pane .storylist,.du-pane .pwacard,.du-pane .today,.du-pane .srscard,.du-pane .beltbar,.du-pane .acctrow{
  margin:0 0 14px;background:var(--paper);border:2px solid var(--du-line);box-shadow:none;border-radius:16px}

.du-set{border:2px solid var(--du-line);border-radius:16px;padding:4px 16px 8px;margin:0 0 14px}
.du-set h3{margin:12px 0 4px}
.du-setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:2px solid var(--du-line);font-weight:700;font-size:15px}
.du-setrow:first-of-type{border-top:0}
.du-sw{border:2px solid var(--du-line);background:var(--paper);border-radius:12px;padding:7px 14px;font-weight:900;color:var(--ink-3);box-shadow:0 3px 0 var(--du-line)}
.du-sw.on{background:var(--du-blue-soft);border-color:var(--du-blue-line);color:var(--du-blue-d);box-shadow:0 3px 0 var(--du-blue-line)}
.du-pbtn{margin:0 0 14px !important;text-align:left;padding-left:18px;display:flex;align-items:center;gap:10px}
.du-pbtn svg{width:24px;height:24px;flex:none}
.du-pt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.du-pt b{font-size:16px;font-weight:900}
.du-pt small{font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.lgbtn{background:var(--du-green);color:#fff;box-shadow:0 3px 0 var(--du-green-d);border-radius:12px}
.lgmore{border-radius:12px}
.du-empty{border:2px dashed var(--du-line);border-radius:16px;padding:22px;text-align:center;color:var(--ink-3);font-weight:700}
.du-profile .homefoot{padding:18px 0 10px}
.du-lockstory .si{color:var(--du-gray-d)}
.du-lockstory .si svg{width:20px;height:20px}
.du-lockstory .sx{color:var(--du-blue-d);font-weight:900}

/* ---- 놀이 길 ---- */
.du-learn .path{padding:4px 16px 30px}
.trackhead .du-sec{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--du-blue-d);margin-bottom:2px}
.unitband{position:sticky;top:var(--du-top,56px);z-index:20;margin:22px 0 6px;border-radius:16px;padding:14px 14px 14px 18px;
  box-shadow:0 4px 0 var(--band-2);gap:10px}
.unitband .num{display:none}
.unitband .du-ul{font-size:12px;font-weight:900;letter-spacing:.04em;opacity:.8;margin-bottom:2px}
.unitband .t{font-size:17px;font-weight:900}
.gbtn{display:flex;align-items:center;gap:5px;border:2px solid rgba(255,255,255,.4);background:transparent;border-radius:12px;
  padding:8px 10px;font-weight:900;font-size:13px;color:inherit}
.gbtn svg{width:18px;height:18px}
.du-jumprow{display:flex;justify-content:center;padding:2px 0 6px;position:relative;z-index:2}
.du-jumpu{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--du-line);background:var(--paper);border-radius:14px;
  padding:9px 14px;font-weight:900;font-size:14px;color:var(--du-blue-d);box-shadow:0 3px 0 var(--du-line)}
.du-jumpu svg{width:16px;height:16px;color:#FFC800}
.du-jumpu:active{transform:translateY(2px);box-shadow:none}
.lessons::before{display:none}
.node-row.du-currow{padding-top:62px}
.speaker{background:var(--du-blue);color:#fff;border:0;box-shadow:0 4px 0 var(--du-blue-d);border-radius:14px}
.speaker.slow{background:var(--paper);color:var(--du-blue-d);border:2px solid var(--du-line);box-shadow:0 4px 0 var(--du-line)}
.speaker:active{transform:translateY(3px);box-shadow:none}
.node-row.locked,.node-row.du-lockrow{opacity:1}
.node.du-n{width:72px;height:66px;border-radius:50%;background:var(--du-gray);color:var(--du-gray-d);
  box-shadow:0 7px 0 color-mix(in srgb, var(--du-gray) 70%, #000 12%)}
.node.du-n svg{width:32px;height:32px;display:block}
.node.du-n.open,.node.du-n.done{background:var(--band);color:#fff;box-shadow:0 7px 0 var(--band-2);--du-dot:var(--band)}
.node.du-n.done{background:#FFC800;color:#fff;box-shadow:0 7px 0 #E0A800}
.node.du-n.du-cur{box-shadow:0 7px 0 var(--band-2), 0 0 0 8px var(--paper), 0 0 0 14px var(--du-gray)}
.node.du-n.du-locked{cursor:pointer}
.node.du-n:not(:disabled):active{transform:translateY(5px) translateX(var(--off,0));box-shadow:0 2px 0 var(--band-2)}
.node.du-n.du-locked:active{box-shadow:0 2px 0 var(--du-gray-d)}
.node.du-n .stars{bottom:-18px}
.du-start{position:absolute;bottom:calc(100% + 22px);left:50%;transform:translateX(-50%);white-space:nowrap;
  background:var(--paper);color:var(--ai);border:2px solid var(--du-line);border-radius:12px;padding:8px 14px;
  font:900 15px/1 "Noto Sans KR",sans-serif;letter-spacing:.04em;animation:du-bob 1.4s ease-in-out infinite;pointer-events:none}
.du-start::after{content:"";position:absolute;top:100%;left:50%;width:12px;height:12px;background:var(--paper);
  border-right:2px solid var(--du-line);border-bottom:2px solid var(--du-line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes du-bob{0%,100%{margin-bottom:0}50%{margin-bottom:6px}}
.node.chest{background:#FFC800;box-shadow:0 7px 0 #E0A800}
.lab{font-weight:700}
@media (prefers-reduced-motion: reduce){ .du-start{animation:none} }

/* ---- 건너뛰기 시트 ---- */
.sheet.du-skip p{line-height:1.6}
.du-note{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin:8px 2px 16px;word-break:keep-all}
.du-jtag{align-self:flex-start;background:var(--du-blue-soft);color:var(--du-blue-d);font-weight:900;font-size:12px;border-radius:10px;padding:5px 10px;margin-bottom:10px}

/* ---- 놀이 화면 ---- */
.lessonbar{border-bottom:0;gap:12px;padding:14px 16px 6px}
.lessonbar #quitBtn{border:0;background:none;box-shadow:none;color:var(--du-gray-d)}
.lessonbar #quitBtn svg{width:26px;height:26px}
.bar{height:16px;background:var(--du-gray)}
.bar>i{background:var(--du-green)}
.hearts{gap:5px}
.hearts .h{color:var(--du-red)}
.hearts .h.off{color:var(--du-gray-d);opacity:1}
.hearts svg{width:26px;height:26px}
.hearts .hn{font-size:18px;font-weight:900;color:var(--du-red);min-width:12px}
.hearts .hn.pop{animation:pop .45s}
.stage{padding-top:18px}
.prompt-label{font-size:22px;font-weight:900;letter-spacing:0;color:var(--ink);margin-bottom:22px;line-height:1.35;word-break:keep-all;
  display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.opts{counter-reset:duo;gap:12px}
.opt{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--du-line);border-bottom-width:2px;
  box-shadow:0 4px 0 var(--du-line);border-radius:14px;padding:13px 14px;font-size:17px;color:var(--ink)}
.opt::before{counter-increment:duo;content:counter(duo);flex:none;width:28px;height:28px;border:2px solid var(--du-line);border-radius:8px;
  display:grid;place-items:center;font:800 14px/1 "Noto Sans KR",sans-serif;color:var(--du-gray-d)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--du-line)}
.opt.sel{background:var(--du-blue-soft);border-color:var(--du-blue-line);box-shadow:0 4px 0 var(--du-blue-line);color:var(--du-blue-d)}
.opt.sel::before{border-color:var(--du-blue-line);color:var(--du-blue-d)}
.opt.right{background:var(--du-green-soft);border-color:var(--du-green-line);box-shadow:0 4px 0 var(--du-green-line);color:var(--du-green-d);text-decoration:none}
.opt.right::before{border-color:var(--du-green-line);color:var(--du-green-d)}
.opt.wrong{background:var(--du-red-soft);border-color:var(--du-red-line);box-shadow:0 4px 0 var(--du-red-line);color:var(--du-red-d);text-decoration:none}
.opt.wrong::before{border-color:var(--du-red-line);color:var(--du-red-d)}
.tok{background:var(--paper);border:2px solid var(--du-line);border-bottom-width:2px;box-shadow:0 4px 0 var(--du-line);border-radius:12px;color:var(--ink)}
.tok:active{transform:translateY(3px);box-shadow:0 1px 0 var(--du-line);border-bottom-width:2px}
.tok.ghost{opacity:1;background:var(--du-gray);border-color:var(--du-gray);box-shadow:none;color:transparent;border-style:solid}
.tok.ghost ruby rt{color:transparent}
.mcard{background:var(--paper);border:2px solid var(--du-line);border-bottom-width:2px;box-shadow:0 4px 0 var(--du-line);border-radius:14px;color:var(--ink)}
.mcard.sel{background:var(--du-blue-soft);border-color:var(--du-blue-line);box-shadow:0 4px 0 var(--du-blue-line);color:var(--du-blue-d)}
.mcard.bad{background:var(--du-red-soft);border-color:var(--du-red-line);color:var(--du-red-d)}
.footer{border-top:2px solid var(--du-line)}
.du-say{display:flex;align-items:flex-end;gap:8px;margin:0 0 4px}
.du-sayhead{flex:none;width:78px}
.du-sayhead img{width:78px;height:auto;display:block}
.du-say .qko{position:relative;flex:1;min-width:0;border:2px solid var(--du-line);border-radius:16px;padding:12px 16px;
  font-size:19px;background:var(--paper);margin-bottom:18px}
.du-say .qko::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--paper);
  border-left:2px solid var(--du-line);border-bottom:2px solid var(--du-line);transform:rotate(45deg)}

input.spellbox{background:var(--paper);border:2px solid var(--du-line);border-radius:14px}
input.spellbox:focus{border-color:var(--du-blue-line);box-shadow:none}
.typebox{background:var(--paper);border:2px solid var(--du-line);border-radius:14px}

/* ---- 채점 ---- */
.feedback{border-top:0}
.feedback.ok{background:var(--du-green-soft)}
.feedback.no{background:var(--du-red-soft)}
.feedback .fb-title{font-size:22px}
.feedback.ok .fb-title,.feedback.ok .fb-body,.feedback.ok .fb-body b{color:var(--du-green-d)}
.feedback.no .fb-title,.feedback.no .fb-body,.feedback.no .fb-body b{color:var(--du-red-d)}
.feedback.ok .fb-badge{background:var(--du-green);box-shadow:0 0 0 3px var(--du-green-soft)}
.feedback.no .fb-badge{background:var(--du-red);box-shadow:0 0 0 3px var(--du-red-soft)}
.feedback.ok .cta{background:var(--du-green);box-shadow:0 4px 0 var(--du-green-d);color:#fff}
.feedback.no .cta{background:var(--du-red);box-shadow:0 4px 0 var(--du-red-d);color:#fff}

/* ---- 후리가나 ---- */
ruby{ruby-position:over}
ruby rt{font-size:.5em;font-weight:500;letter-spacing:0;color:var(--ink-3);font-family:"Noto Sans JP","Noto Sans KR",sans-serif;user-select:none}
.opt.sel ruby rt,.opt.right ruby rt,.opt.wrong ruby rt,.feedback ruby rt,.mcard.sel ruby rt{color:inherit;opacity:.75}
.unitband ruby rt,.trackhead ruby rt{color:inherit;opacity:.8}
.qjp ruby rt{font-size:.42em}
ruby rt{color:var(--ink-2)}

/* ---- 작은 화면 ---- */

:focus-visible{outline-color:var(--du-blue-line)}
input:focus-visible,textarea:focus-visible{outline:none}

/* ---- 로그인 유지 안내 ---- */
.du-keep{margin:14px 2px 0;font-size:13px;line-height:1.55;color:var(--ink-3);word-break:keep-all}
.du-inapp{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--du-blue-soft);border:2px solid var(--du-blue-line);
  color:var(--ink);font-size:13.5px;line-height:1.55;word-break:keep-all}
.du-inapp span{display:block;margin-top:4px;color:var(--ink-2)}
.du-inapp-go{display:block;margin-top:10px;border:0;border-radius:12px;padding:10px 14px;background:var(--du-blue);color:#fff;
  font-weight:900;box-shadow:0 3px 0 var(--du-blue-d)}

/* ================= 꾸미기 · 도감 · 챌린지 · 출석 ================= */
.fxav{--s:64px;position:relative;display:inline-block;flex:none;width:var(--s);height:var(--s);border-radius:50%;
  padding:calc(var(--s)*.075);background:var(--du-line);vertical-align:middle}
.fxbg{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#DDF4FF}
.fxbg img.neko{width:92%;height:auto;margin-top:12%;display:block}
.fxemo{font-size:calc(var(--s)*.5);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.fxhat{position:absolute;top:calc(var(--s)*-.16);right:calc(var(--s)*-.08);font-size:calc(var(--s)*.4);line-height:1;transform:rotate(14deg);
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;pointer-events:none}
.f-nf{background:var(--du-line)}
.f-sv{background:linear-gradient(135deg,#F4F6F8,#9EA7AD 45%,#E8ECEF 70%,#7D878D)}
.f-gd{background:linear-gradient(135deg,#FFF3B0,#FFC800 40%,#E0A800 70%,#FFE680)}
.f-fi{background:linear-gradient(135deg,#FFC800,#FF9600 40%,#FF4B4B 80%)}
.f-rw{background:conic-gradient(#FF4B4B,#FF9600,#FFC800,#58CC02,#1CB0F6,#CE82FF,#FF4B4B)}
.f-sk{background:linear-gradient(135deg,#FFE3F1,#FF86D0 55%,#FFB7D5)}
.f-pf{background:linear-gradient(135deg,#A5ED6E,#58CC02 55%,#89E219)}
.f-lg{background:linear-gradient(135deg,#CE82FF,#1CB0F6)}
.f-ic{background:linear-gradient(135deg,#FFFFFF,#84D8FF 50%,#DDF4FF)}
.f-mo{background:linear-gradient(135deg,var(--m1),var(--m2))}
.b-sy{background:#DDF4FF}.b-wh{background:#FFFFFF}.b-mt{background:#D2F8E4}.b-pc{background:#FFE1CF}
.b-ss{background:linear-gradient(180deg,#FFC67A,#FF6F91)}
.b-oc{background:linear-gradient(180deg,#5FD3FF,#1073C4)}
.b-ns{background:radial-gradient(circle at 25% 30%,#fff 0 1.2px,transparent 1.6px),radial-gradient(circle at 70% 20%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 60% 70%,#fff 0 1.1px,transparent 1.5px),linear-gradient(180deg,#1B2A4A,#3B3F8F)}
.b-cd{background:linear-gradient(135deg,#FFD6F5,#C9F0FF)}
.b-gl{background:radial-gradient(circle at 35% 30%,#FFF6C8,#FFC800 70%)}
.tabav.fxav{--s:30px;padding:2px}
.du-tab .tabav .fxhat{font-size:12px}

.fxcard{border:2px solid var(--du-line);border-radius:16px;padding:14px;margin:0 0 14px;background:var(--paper)}
.fxprof{display:flex;gap:14px;align-items:center;margin-top:18px}
.fxme{position:relative;border:0;background:none;padding:6px 0 0}
.fxpen{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--du-blue);color:#fff;display:grid;place-items:center;
  font-size:14px;border:3px solid var(--paper)}
.fxpi{flex:1;min-width:0}
.fxpn{font-size:19px;font-weight:900;color:var(--ink);word-break:break-all}
.fxpt{display:inline-block;margin-top:4px;font-size:12px;font-weight:900;color:#fff;background:linear-gradient(135deg,#CE82FF,#1CB0F6);border-radius:10px;padding:3px 9px}
.fxps{display:flex;flex-wrap:wrap;gap:4px 10px;margin:8px 0 10px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.fxpb{display:flex;gap:8px}.fxpb .cta{padding:10px 6px;font-size:13.5px;white-space:nowrap}
.fxch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.fxch b{font-size:16px;font-weight:900;color:var(--ink)}.fxch span{font-size:12.5px;color:var(--ink-3);font-weight:700;text-align:right}
.fxdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.fxday{border:2px solid var(--du-line);border-radius:12px;padding:6px 0 5px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.fxday i{font-style:normal;font-size:10.5px;font-weight:800;color:var(--ink-3)}
.fxday b{font-size:18px;line-height:1.2}
.fxday small{font-size:9.5px;color:var(--ink-3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.fxday.done{background:var(--du-green-soft);border-color:var(--du-green-line)}.fxday.done b{color:var(--du-green-d)}
.fxday.today{border-color:#FFC800;background:#FFF8D6;animation:du-bob 1.4s ease-in-out infinite}
:root[data-theme="dark"] .fxday.today{background:#3A3316}
.fxattgo{margin-top:12px}
.fxmrow{display:flex;gap:12px;align-items:center}.fxmt{flex:1;min-width:0}
.fxmt b{display:block;font-size:15.5px;font-weight:900;color:var(--ink)}.fxmt span{display:block;font-size:12.5px;color:var(--ink-3);margin:2px 0 8px;font-weight:700}
.fxmt small{display:block;margin-top:5px;font-size:11.5px;color:var(--ink-3)}
.fxbar{height:12px;border-radius:10px;background:var(--du-gray);overflow:hidden}.fxbar i{display:block;height:100%;background:linear-gradient(90deg,#FFC800,#FF9600);border-radius:10px}
.fxhh{border-radius:14px;padding:11px 14px;margin:0 0 14px;font-size:13.5px;font-weight:700;color:var(--ink-2);background:var(--paper-3)}
.fxhh.on{background:linear-gradient(135deg,#FF9600,#FF4B4B);color:#fff;box-shadow:0 3px 0 #D2362F}
.fxhh b{font-weight:900}
.lgav{flex:none;margin-right:8px;display:flex;align-items:center}
.lgrow{align-items:center}

.fxedit{padding:8px 16px 40px}
.fxprev{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 14px}
.fxprev .fxpn{margin-top:8px}
.fxcats{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.fxcat{flex:none;border:2px solid var(--du-line);background:var(--paper);border-radius:12px;padding:8px 12px;font-weight:900;font-size:13.5px;color:var(--ink-3)}
.fxcat.on{border-color:var(--du-blue-line);background:var(--du-blue-soft);color:var(--du-blue-d)}
.fxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fxgrid.titles{grid-template-columns:1fr 1fr}
.fxit{border:2px solid var(--du-line);border-radius:16px;background:var(--paper);padding:12px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;
  box-shadow:0 3px 0 var(--du-line);min-width:0}
.fxit.on{border-color:var(--du-blue-line);background:var(--du-blue-soft);box-shadow:0 3px 0 var(--du-blue-line)}
.fxit.lock .fxav,.fxit.lock .fxtl{filter:grayscale(1);opacity:.45}
.fxn{font-size:12.5px;font-weight:900;color:var(--ink)}
.fxhow{font-size:10.5px;font-weight:700;color:var(--ink-3);text-align:center;line-height:1.3;padding:0 4px;display:flex;align-items:center;gap:2px;word-break:keep-all}
.fxhow svg{width:13px;height:13px}
.fxit.on .fxhow{color:var(--du-blue-d)}
.fxtl{font-size:14px;font-weight:900;color:#fff;background:linear-gradient(135deg,#CE82FF,#1CB0F6);border-radius:10px;padding:6px 10px;text-align:center}
.fxnote{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:16px}
.fxstk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fxs{border:2px solid var(--du-line);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0;background:var(--paper)}
.fxs .e{font-size:30px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.fxs .n{font-size:10.5px;font-weight:800;color:var(--ink-2);line-height:1.25;word-break:keep-all}
.fxs .h{font-size:9.5px;color:var(--ink-3)}
.fxs.lock .e{filter:grayscale(1) brightness(0);opacity:.18}
.fxs.lock{background:var(--paper-3)}
.fxsheet{text-align:center}
.fxnew{display:flex;justify-content:center;padding:14px 0 6px}
.fxnewlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 16px}
.fxnewlist span{border:2px solid var(--du-line);border-radius:10px;padding:4px 9px;font-size:13px;font-weight:800;color:var(--ink-2)}
.fxsheet .fxatt{text-align:left;border:0;padding:0}
.shopitem .shi .fxav{--s:44px}

/* ================= 한글 놀이터 ================= */
.jp{font-family:"Jua","Noto Sans KR",sans-serif;letter-spacing:0}
.qjp,.opt.jp,.mcard.jpc,.tok.jp,.qkana,.hero h1,.unitband .t{font-family:"Jua","Noto Sans KR",sans-serif}
.qjp{font-size:40px;font-weight:400}
.qjp.solo{font-size:84px;line-height:1.15}
.opt.jp{font-size:24px;font-weight:400}
.prompt-label{font-size:19px}
/* 하트 없음 — 시험(건너뛰기)일 때만 보입니다 */
.lessonbar .hearts{display:none}
body.k-test .lessonbar .hearts{display:flex}
#hpBtn{display:none!important}
.du-tab[data-tab="league"],.du-league,.lgcard{display:none!important}
/* 그림 보기 */

function chunk(arr,k){ const out=[],n=arr.length; let i=0;
  for(let p=0;p<k;p++){ const len=Math.ceil((n-i)/(k-p)); out.push(arr.slice(i,i+len)); i+=len; }

/* 말한 것과 목표를 비교하기 전에 군더더기를 걷어냅니다 */
function normSay(s){
  return String(s||'')
    .toLowerCase()
    .replace(/[^a-z0-9가-힣' ]/gu, '')
    .replace(/\s+/g, ' ')
    .trim();
}
/* 편집 거리로 얼마나 가까운지 — 0(전혀 다름) ~ 1(똑같음) */
function simRatio(a, b){
  a=normSay(a); b=normSay(b);
  if(!a || !b) return 0;
  if(a===b) return 1;
  const m=a.length, n=b.length;
  let prev=new Array(n+1), cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    const t=prev; prev=cur; cur=t;
  }
  return Math.max(0, 1 - prev[n]/Math.max(m,n));
}

/* 연습할 문장 고르기 — 이미 배운 것 우선, 없으면 열린 단원에서 */
function speakItems(n){
  const known=new Set(Object.keys(S.srs||{}));
  const openUnits=UNITS.filter(u=>u.lessons.some(l=>S.done[l.id]));
  const poolS=(openUnits.length?openUnits:UNITS.slice(0,2)).flatMap(u=>u.s||[]);
  const poolW=(openUnits.length?openUnits:UNITS.slice(0,2)).flatMap(u=>u.w||[]);
  const hit=x=>known.has(x.j);
  const first=poolS.filter(hit), second=poolW.filter(hit);
  let out=pick(first, Math.min(n, first.length));
  if(out.length<n) out=out.concat(pick(second, Math.min(n-out.length, second.length)));
  if(out.length<n) out=out.concat(pick(poolS, Math.min(n-out.length, poolS.length)));
  if(out.length<n) out=out.concat(pick(poolW, Math.min(n-out.length, poolW.length)));
  return shuffle(out).slice(0, n);
}

    <div class="qjp jp tappable" id="spSay" role="button" aria-label="눌러서 듣기">${esc(e.j)}</div>
    ${e.k && e.k!==e.j ? `<div class="qkana jp">${esc(e.k)}</div>` : ''}
    <div class="qko" style="margin-top:10px">${esc(e.m||'')}</div>
    <div class="sayrow" style="margin-top:18px">
      <button class="speaker" id="spHear">${ICON.sound} 먼저 듣기</button>
      <button class="speaker slow" id="spHearSlow">${ICON.turtle} 느리게</button>
    </div>
    <div class="micwrap">
      <button class="micbtn" id="spMic" aria-label="말하기 시작">${MIC_SVG}</button>

    </div>
  </div>
  <div class="footer"><div class="footer-inner">
    <button class="cta ghost" id="spSkip">이 문장 건너뛰기</button>
  </div></div>
  <div class="feedback" id="fb">
    <div class="fb-inner">
      <div class="fb-mark jp" id="fbMark"></div>
      <div class="fb-text"><div class="fb-title" id="fbTitle"></div><div class="fb-body" id="fbBody"></div></div>
    </div>
    <div class="footer-inner"><button class="cta" id="fbBtn">계속하기</button></div>
  </div>`;
  petalsOff();
  const say=()=>speak(e.j);
  $('#spSay').onclick=()=>say();
  $('#spHear').onclick=()=>say();
  $('#spHearSlow').onclick=()=>speak(e.j, true);
  $('#spQuit').onclick=()=>{ sfx('tap'); endSpeak(); renderHome(); };
  $('#spSkip').onclick=()=>{ sfx('tap'); speakNext(); };
  $('#spMic').onclick=()=>micGo(e);

}

function micGo(e){
  if(SP.busy) { try{ SP.rec.stop(); }catch(x){} return; }
  let rec;
  try{ rec=new SRec(); }catch(x){ return micFail('이 브라우저에서는 마이크를 쓸 수 없어요.'); }
  SP.rec=rec; SP.busy=true;
  rec.lang=SPEAK_LANG; rec.interimResults=false; rec.maxAlternatives=3;
  const btn=$('#spMic'), hint=$('#spHint');
  if(btn) btn.classList.add('on');
  if(hint) hint.textContent='듣고 있어요… 말해 보세요';
  let got=false;
  rec.onresult=(ev)=>{
    got=true;
    const alts=[...ev.results[0]].map(r=>r.transcript);
    /* 여러 후보 중 가장 가까운 것으로 봐 줍니다 */
    let best=alts[0], bs=0;
    alts.forEach(t=>{ const s=simRatio(t, e.j); if(s>bs){ bs=s; best=t; } });
    SP.said=best; SP.sim=bs;
    judgeSpeak(e);
  };
  rec.onerror=(ev)=>{
    SP.busy=false;
    if(btn) btn.classList.remove('on');
    const code=ev && ev.error;
    if(code==='not-allowed' || code==='service-not-allowed')
      micFail('마이크 사용이 막혀 있어요. 주소창 옆 자물쇠에서 허용해 주세요.');
    else if(code==='no-speech') { if(hint) hint.textContent='소리가 안 들렸어요. 한 번 더 눌러 주세요'; }
    else if(hint) hint.textContent='다시 눌러 주세요';
  };
  rec.onend=()=>{
    SP.busy=false;
    if(btn) btn.classList.remove('on');
    if(!got && hint && hint.textContent.indexOf('듣고')===0) hint.textContent='한 번 더 눌러 주세요';
  };
  try{ rec.start(); }catch(x){ SP.busy=false; if(btn) btn.classList.remove('on'); }
}
function micFail(msg){
  SP.busy=false;
  openSheet('마이크', msg, '닫기', closeSheet, '', closeSheet);
}

function judgeSpeak(e){
  const s=SP.sim;
  const good = s>=.82, close = !good && s>=.58;
  SP.judged = good?'good':(close?'close':'no');
  if(good){ SP.good++; SP.xp+=12; sfx('correct'); burst(innerWidth*.5, innerHeight*.5, 18, .9); }
  else if(close){ SP.close++; SP.xp+=5; sfx('pair'); }
  else { sfx('wrong'); shakeScreen(false); }
  srsTouch(e, good);
  save();
  const fb=$('#fb'), mark=$('#fbMark'), t=$('#fbTitle'), b=$('#fbBody');
  if(!fb) return;
  mark.innerHTML=`<div class="neko-${good?'happy':'sad'}">${nekoHead(good?'happy':'sad')}</div>
    <span class="fb-badge jp">${good?'〇':(close?'△':'✕')}</span>`;
  fb.classList.add(good?'ok':'no','show');
  t.textContent = good ? '좋아요! 잘 들렸어요' : (close ? '거의 맞았어요' : '한 번 더 해볼까요');
  b.innerHTML = `들린 말: <b>${esc(SP.said||'—')}</b>　·　일치도 ${Math.round(s*100)}%`
    + `<div class="simbar"><i style="width:${Math.round(s*100)}%" class="${good?'g':(close?'c':'n')}"></i></div>`;
  $('#fbBtn').textContent = good ? '다음' : '다시 말해 보기';
  $('#fbBtn').onclick = good ? speakNext : ()=>{
    fb.classList.remove('show','ok','no');
    const h=$('#spHint'); if(h) h.textContent='누르고 말하세요';
  };
  setTimeout(()=>speak(e.j), 380);
}

function speakNext(){
  SP.i++;
  if(SP.i>=SP.items.length) return renderSpeakResult();
  renderSpeakStep();
}

function renderSpeakResult(){
  const n=SP.items.length, good=SP.good, xp=SP.xp;
  S.xp+=xp; addTodayXp(xp);
  const doneQ=questBump('xp', xp);
  bumpStreak(); save();
  if(typeof CLOUD!=='undefined' && CLOUD.queue) CLOUD.queue();
  if(typeof leagueBump==='function') leagueBump(xp);
  sfx('complete');
  setTimeout(()=>burst(innerWidth*.3, innerHeight*.45, 30, 1.2), 120);
  setTimeout(()=>burst(innerWidth*.7, innerHeight*.45, 30, 1.2), 300);
  app.innerHTML=`
  <div class="center-screen">
    ${nekoBlock('cheer','声',146)}
    <h2>말하기 끝!</h2>
    <p class="sub">${n}문장 중 <b>${good}문장</b>을 또렷하게 말했어요.${SP.close?` ${SP.close}문장은 거의 맞았습니다.`:''}</p>
    <div class="scorecards">
      <div class="scard gold"><div class="h">획득 XP</div><div class="v">+${xp}</div></div>
      <div class="scard shu"><div class="h">또렷하게</div><div class="v">${good}/${n}</div></div>
    </div>
    ${doneQ.length?`<p class="sub" style="margin-top:14px">오늘의 과제 ${doneQ.length}개 완료 · <b>+${doneQ.length*QUEST_XP} XP</b></p>`:''}
    <div style="width:100%">
      <button class="cta shu" id="spAgain">한 번 더</button>
      <button class="cta ghost" id="spHome" style="margin-top:10px">지도로 돌아가기</button></div>
  </div>`;
  petalsOn();
  $('#spAgain').onclick=()=>{ sfx('tap'); endSpeak(); startSpeak(); };
  $('#spHome').onclick=()=>{ sfx('tap'); endSpeak(); renderHome(); };
  window.scrollTo(0,0);
}

/* ================= 이야기 (짧은 대화) =================
   두 사람이 주고받는 짧은 대화를 한 줄씩 넘겨 가며 봅니다.
   줄을 누르면 소리가 나고, 중간에 빈칸 하나, 끝에 이해 확인 한 문제.
   끝내면 한 번만 XP 를 줍니다.                                     */

const STORY_XP = 70;
let ST = null;

function storyOpen(s){ return !s.need || !!S.done[s.need]; }
function storyDone(s){ return !!(S.story && S.story[s.id]); }
function storiesReady(){ return STORIES.filter(storyOpen); }

function startStory(id){
  const s=STORIES.find(x=>x.id===id);
  if(!s || !storyOpen(s)) return renderHome();
  ST={ s, n:1, gapDone:{}, wrong:0, phase:'lines' };
  renderStory();
}

function storySpeak(li){
  const t = li.gap ? String(li.t).replace('___', li.gap.a) : li.t;
  speak(t);
}

function renderStory(){
  const s=ST.s;
  const shown=s.lines.slice(0, ST.n);
  const cur=s.lines[ST.n-1];
  const needGap = cur && cur.gap && !ST.gapDone[ST.n-1];
  const atEnd = ST.n>=s.lines.length && !needGap;

  let h=`
  <div class="lessonbar">
    <button class="iconbtn" id="stQuit" aria-label="나가기">${ICON.x}</button>
    <div class="bar" role="progressbar"><i style="width:${Math.round(ST.n/(s.lines.length+1)*100)}%"></i></div>
    <div class="stat xp">${ICON.bolt}<span class="mono">${STORY_XP}</span></div>
  </div>
  <div class="stage storystage">
    <div class="storyhead"><div class="t">${esc(s.title)}</div><div class="s">${esc(s.sub)}</div></div>
    <div class="chat">`;

  shown.forEach((li, idx)=>{
    const me = li.w==='a';
    const solved = !li.gap || ST.gapDone[idx];
    const txt = li.gap
      ? (solved ? String(li.t).replace('___', '<b>'+esc(li.gap.a)+'</b>') : esc(li.t))
      : esc(li.t);
    const ko = li.gap ? String(li.m).replace('___', solved? esc(li.gap.km||li.gap.a) : '___') : esc(li.m);
    h+=`<div class="crow ${me?'l':'r'}${idx===ST.n-1?' fresh':''}">
      <div class="cwho">${esc(me? s.cast.a : s.cast.b)}</div>
      <button class="cbub" data-line="${idx}">
        <div class="ct jp">${txt}</div>
        ${li.k?`<div class="ck jp">${esc(li.k)}</div>`:''}
        <div class="cm">${ko}</div>
      </button>
    </div>`;
  });
  h+=`</div>`;

  if(needGap){
    h+=`<div class="gapbox">
      <div class="gaph">빈칸에 들어갈 말은?</div>
      <div class="gapopts">${shuffle(cur.gap.o).map(o=>
        `<button class="opt gapopt" data-g="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    </div>`;
  }
  h+=`</div>
  <div class="footer"><div class="footer-inner">
    ${needGap ? `<button class="cta" disabled>빈칸을 골라 주세요</button>`
      : (atEnd ? `<button class="cta shu" id="stQuiz">마지막 문제</button>`
               : `<button class="cta" id="stNext">계속하기</button>`)}
  </div></div>`;

  app.innerHTML=h;
  petalsOff();
  $('#stQuit').onclick=()=>{ sfx('tap'); ST=null; renderHome(); };
  app.querySelectorAll('.cbub[data-line]').forEach(b=>{
    b.onclick=()=>storySpeak(s.lines[+b.dataset.line]);
  });
  const nx=$('#stNext'); if(nx) nx.onclick=()=>{ sfx('tap'); ST.n++; renderStory(); };
  const qz=$('#stQuiz'); if(qz) qz.onclick=()=>{ sfx('tap'); ST.phase='quiz'; renderStoryQuiz(); };
  app.querySelectorAll('.gapopt').forEach(b=>{
    b.onclick=()=>{
      const ok = b.dataset.g===cur.gap.a;
      if(ok){
        ST.gapDone[ST.n-1]=1;
        sfx('correct'); b.classList.add('right');
        setTimeout(()=>{ renderStory(); storySpeak(cur); }, 380);
      } else {
        ST.wrong++;
        sfx('wrong'); shakeScreen(false); b.classList.add('wrong'); b.disabled=true;
      }
    };
  });
  /* 새로 나온 줄은 자동으로 한 번 읽어 줍니다 */
  const last=s.lines[ST.n-1];
  if(last && (!last.gap || ST.gapDone[ST.n-1])) setTimeout(()=>storySpeak(last), 220);
  const chat=app.querySelector('.crow.fresh');
  if(chat) setTimeout(()=>chat.scrollIntoView({block:'center', behavior:'smooth'}), 60);
}

function renderStoryQuiz(){
  const s=ST.s, q=s.quiz;
  app.innerHTML=`
  <div class="lessonbar">
    <button class="iconbtn" id="stQuit2" aria-label="나가기">${ICON.x}</button>
    <div class="bar"><i style="width:100%"></i></div>
    <div class="stat xp">${ICON.bolt}<span class="mono">${STORY_XP}</span></div>
  </div>
  <div class="stage">
    <div class="prompt-label">이야기를 잘 보았나요?</div>
    <div class="qko">${esc(q.q)}</div>
    <div class="opts" style="margin-top:22px">${shuffle(q.o).map(o=>
      `<button class="opt" data-q="${esc(o)}">${esc(o)}</button>`).join('')}</div>
  </div>
  <div class="footer"><div class="footer-inner"><button class="cta" id="stBack">이야기 다시 보기</button></div></div>`;
  petalsOff();
  $('#stQuit2').onclick=()=>{ sfx('tap'); ST=null; renderHome(); };
  $('#stBack').onclick=()=>{ sfx('tap'); ST.phase='lines'; renderStory(); };
  app.querySelectorAll('.opt[data-q]').forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.q===q.a){ sfx('correct'); b.classList.add('right'); setTimeout(renderStoryResult, 420); }
      else { ST.wrong++; sfx('wrong'); shakeScreen(true); hitFlash(); b.classList.add('wrong'); b.disabled=true; }
    };
  });
  window.scrollTo(0,0);
}

function renderStoryResult(){
  const s=ST.s;
  const first = !storyDone(s);
  const xp = first ? STORY_XP : Math.round(STORY_XP*.3);
  S.story=S.story||{};
  if(first){ S.story[s.id]=dayKey(new Date()); S.gem=(S.gem|0)+10; }
  S.xp+=xp; addTodayXp(xp);
  const doneQ=questBump('xp', xp);
  bumpStreak(); save();
  if(typeof CLOUD!=='undefined' && CLOUD.queue) CLOUD.queue();
  if(typeof leagueBump==='function') leagueBump(xp);
  sfx('complete');
  setTimeout(()=>burst(innerWidth*.3, innerHeight*.45, 34, 1.2), 120);
  setTimeout(()=>burst(innerWidth*.7, innerHeight*.45, 34, 1.2), 320);
  const nxt = STORIES.filter(x=>storyOpen(x) && !storyDone(x) && x.id!==s.id)[0];
  app.innerHTML=`
  <div class="center-screen">
    ${nekoBlock('cheer','話',146)}
    <h2>이야기 끝!</h2>
    <p class="sub">${esc(s.title)} · ${ST.wrong===0 ? '한 번도 안 틀렸어요!' : '끝까지 잘 따라왔어요'}</p>
    <div class="scorecards">
      <div class="scard gold"><div class="h">획득 XP</div><div class="v">+${xp}</div></div>
      <div class="scard shu"><div class="h">읽은 이야기</div><div class="v">${Object.keys(S.story||{}).length}</div></div>
    </div>
    ${first?'':'<p class="sub" style="margin-top:12px;opacity:.8">이미 읽은 이야기라 XP 가 줄어듭니다.</p>'}
    ${doneQ.length?`<p class="sub" style="margin-top:12px">오늘의 과제 ${doneQ.length}개 완료 · <b>+${doneQ.length*QUEST_XP} XP</b></p>`:''}
    <div style="width:100%">
      ${nxt?`<button class="cta shu" id="stNextStory">다음 이야기 · ${esc(nxt.title)}</button>
             <button class="cta ghost" id="stHome" style="margin-top:10px">지도로 돌아가기</button>`
           :`<button class="cta shu" id="stHome">지도로 돌아가기</button>`}
    </div>
  </div>`;
  petalsOn();
  const ns=$('#stNextStory');
  if(ns) ns.onclick=()=>{ sfx('tap'); startStory(nxt.id); };
  $('#stHome').onclick=()=>{ sfx('tap'); ST=null; renderHome(); };
  window.scrollTo(0,0);
}

/* 홈에 붙는 이야기 목록 */
function storyCardHTML(){
