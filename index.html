/* ================= 주간 리그 =================
   같은 조의 사람들과 이번 주 XP 로 겨룹니다. 월요일에 조가 새로 짜이고,
   위에서 세 명은 올라가고 아래에서 세 명은 내려갑니다.

   보이는 것은 **여기서 직접 정한 별명과 이번 주 XP 뿐**입니다.
   아이디·이메일·진도·정답률은 절대 올라가지 않습니다.
   참가는 스스로 눌러야 시작되고, 언제든 나갈 수 있습니다.        */

const LG_COL  = 'league_ko';
const LG_TIERS = [{ko:'숲 리그',g:'I',c:'#4E9A72'},{ko:'강 리그',g:'II',c:'#16607F'},{ko:'산 리그',g:'III',c:'#DE8B3F'},{ko:'호수 리그',g:'IV',c:'#8B4BB8'},{ko:'별 리그',g:'V',c:'#B8871B'}];
const LG_UP = 3, LG_DOWN = 3;          /* 위 3명 승급 · 아래 3명 강등 */
const LG_MIN_UP = 4, LG_MIN_DOWN = 8;  /* 사람이 너무 적으면 적용하지 않습니다 */
const LG_NAME_MAX = 12;

/* 그 주의 월요일 — 조를 가르는 기준 */
function weekKey(d){
  const t=new Date(d||Date.now());
  t.setHours(0,0,0,0);
  t.setDate(t.getDate() - ((t.getDay()+6)%7));   /* 월요일로 */
  return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();
}
function lgState(){
  if(!S.lg) S.lg={on:false, name:'', tier:0, wk:'', xp:0, lastWk:'', lastRank:0, lastMove:'', lastTier:0};
  return S.lg;
}
function lgCohort(tier, wk){ return 'T'+tier+'-'+wk; }
function lgTier(i){ return LG_TIERS[Math.max(0, Math.min(LG_TIERS.length-1, i|0))]; }
function lgOnline(){ return !!(typeof CLOUD!=='undefined' && CLOUD.ready && CLOUD.user && CLOUD.api); }

/* 아무 것도 알려 주지 않는 별명을 하나 만들어 줍니다 */
const LG_WORDS=['바람','구름','달빛','산새','물결','돌담','연필','종이','모래','등불','풀잎','파도'];
function lgSuggestName(){
  return LG_WORDS[Math.floor(Math.random()*LG_WORDS.length)] + ' ' + (10+Math.floor(Math.random()*90));
}
function lgNameBad(v){
  const s=String(v||'').trim();
  if(!s) return '별명을 적어 주세요.';
  if([...s].length>LG_NAME_MAX) return '별명은 '+LG_NAME_MAX+'자까지예요.';
  if(/[@<>]/.test(s) || /\s{3,}/.test(s)) return '쓸 수 없는 글자가 들어 있어요.';
  return '';
}

let LGBOARD=null, LG_T=null, LG_BUSY=false, LG_LAST=0;

/* 이번 주 XP 를 쌓습니다 — 놀이·이야기·말하기 어디서든 불립니다 */
function leagueBump(xp){
  const g=lgState(), wk=weekKey();
  if(g.wk!==wk){ g.wk=wk; g.xp=0; }
  g.xp=(g.xp|0)+(xp|0);
  save();
  if(g.on) lgPushSoon();
}
function lgPushSoon(){
  clearTimeout(LG_T);
  LG_T=setTimeout(lgPush, 2000);
}
async function lgPush(){
  const g=lgState();
  if(!g.on || !lgOnline()) return;
  try{
    const f=CLOUD.api.f, uid=CLOUD.user.uid;
    const id=lgCohort(g.tier, g.wk)+'__'+uid;
    const lgDoc={ c: lgCohort(g.tier, g.wk), n: g.name, x: g.xp|0, t: g.tier|0, u: uid, at: Date.now() };
    if(typeof fxCode==='function' && !window.__lgNoA) lgDoc.a=fxCode();
    try{ await f.setDoc(f.doc(CLOUD.api.fs, LG_COL, id), lgDoc); }
    catch(e1){ if(!lgDoc.a) throw e1; window.__lgNoA=true; delete lgDoc.a; await f.setDoc(f.doc(CLOUD.api.fs, LG_COL, id), lgDoc); }
  }catch(e){}
}
async function lgFetch(){
  const g=lgState();
  if(!g.on || !lgOnline()) return null;
  try{
    const f=CLOUD.api.f;
    const q=f.query(f.collection(CLOUD.api.fs, LG_COL), f.where('c','==', lgCohort(g.tier, g.wk)));
    const snap=await f.getDocs(q);
    const rows=[];
    snap.forEach(d=>{ const v=d.data(); rows.push({n:v.n, x:v.x|0, u:v.u, a:v.a, me: v.u===CLOUD.user.uid}); });
    rows.sort((a,b)=> b.x-a.x || String(a.n).localeCompare(String(b.n)));
    return rows;
  }catch(e){ return null; }
}

/* 주가 바뀌면 지난주 등수를 보고 올리거나 내립니다 */
async function lgRollWeek(){
  const g=lgState(), wk=weekKey();
  if(!g.on || g.wk===wk) return false;
  const oldWk=g.wk, oldTier=g.tier|0;
  let moved='';
  if(oldWk && lgOnline()){
    try{
      const f=CLOUD.api.f;
      const q=f.query(f.collection(CLOUD.api.fs, LG_COL), f.where('c','==', lgCohort(oldTier, oldWk)));
      const snap=await f.getDocs(q);
      const rows=[]; snap.forEach(d=>rows.push(d.data()));
      rows.sort((a,b)=> (b.x|0)-(a.x|0));
      const i=rows.findIndex(r=>r.u===CLOUD.user.uid);
      if(i>=0){
        g.lastRank=i+1; g.lastWk=oldWk; g.lastTier=oldTier;
        if(rows.length>=LG_MIN_UP && i<LG_UP && oldTier<LG_TIERS.length-1){ g.tier=oldTier+1; moved='up'; S.gem=(S.gem|0)+50; }
        else if(rows.length>=LG_MIN_DOWN && i>=rows.length-LG_DOWN && oldTier>0){ g.tier=oldTier-1; moved='down'; }
        else moved='stay';
      }
    }catch(e){}
  }
  g.lastMove=moved; g.wk=wk; g.xp=0; save();
  await lgPush();
  return !!moved;
}

let STREAK_EVT = null;
const STREAK_MILES = [3,7,14,30,50,100,200,365];

/* 결과 화면에서 처음 누르는 단추를 붙잡아, 스트릭 화면을 먼저 보여 준 뒤 원래 하려던 일을 합니다 */
function streakGate(){
  const ev=STREAK_EVT;
  if(!ev) return;
  if(!app.querySelector('.center-screen')){ STREAK_EVT=null; return; }
  const h=(e)=>{
    const scr=app.querySelector('.center-screen');
    const b=e.target.closest && e.target.closest('button');
    if(!scr || !b || !scr.contains(b)){ app.removeEventListener('click', h, true); STREAK_EVT=null; return; }
    e.preventDefault(); e.stopImmediatePropagation();
    app.removeEventListener('click', h, true);
    STREAK_EVT=null;
    showStreakScreen(ev, ()=>b.click());
  };
  app.addEventListener('click', h, true);
}

function showStreakScreen(ev, cont){
  const to=ev.to|0, from=Math.max(0,to-1);
  const mile = STREAK_MILES.indexOf(to)>=0;
  const wk=[]; for(let i=6;i>=0;i--){ const d=new Date(Date.now()-i*864e5);
    wk.push({k:dayKey(d), l:'일월화수목금토'[d.getDay()], t:i===0}); }
  const msg = ev.fz ? '보호막이 스트릭을 지켜 줬어요. 오늘도 해냈어요!'
    : mile ? to+'일 연속! 여기까지 온 사람은 많지 않아요.'
    : to===1 ? '오늘부터 시작이에요. 내일도 오면 2일이 됩니다.'
    : '내일도 이어가요. 잊지 않게 이 시간에 다시 와요.';
  const d=document.createElement('div');
  d.className='stkscreen'+(mile?' mile':'');
  d.innerHTML=`
    <div class="stkglow"></div>
    <div class="stkflame">${ICON.flame}</div>
    <div class="stknum mono" id="stkNum">${from}</div>
    <div class="stklab">일 연속 학습${mile?' 달성':''}!</div>
    <div class="stkweek">${wk.map(x=>`<div class="d${S.act.indexOf(x.k)>=0&&!x.t?' on':''}${x.t?' now':''}">
      <div class="dot">${S.act.indexOf(x.k)>=0&&!x.t?'✓':''}</div><div class="lb">${x.l}</div></div>`).join('')}</div>
    <p class="stkmsg">${esc(msg)}</p>
    <button class="cta shu" id="stkGo">계속하기</button>`;
  document.body.appendChild(d);
  requestAnimationFrame(()=>d.classList.add('show'));
  sfx('streak');
  setTimeout(()=>{
    const n=d.querySelector('#stkNum'); if(n){ n.textContent=to; n.classList.add('pop'); }
    const now=d.querySelector('.stkweek .now'); if(now){ now.classList.add('on'); now.querySelector('.dot').textContent='✓'; }
    d.querySelector('.stkflame').classList.add('big');
    sfx(mile?'lvlup':'goal');
    burst(innerWidth*.5, innerHeight*.36, mile?60:34, mile?1.6:1.2);
    if(mile) setTimeout(()=>{ burst(innerWidth*.25, innerHeight*.5, 40, 1.4); burst(innerWidth*.75, innerHeight*.5, 40, 1.4); }, 260);
  }, RM?0:650);
  d.querySelector('#stkGo').onclick=()=>{
    sfx('tap');
    d.classList.remove('show');
    setTimeout(()=>{ d.remove(); try{ cont(); }catch(_){ renderHome(); } }, RM?0:220);
  };
}

function startPlacement(){
  const units=OB.place.units;

  let ex=[];
  ls.forEach(l=>{ try{ ex=ex.concat(makeExercises(l).filter(e=>e.kind!=='match')); }catch(_){} });
  ex=shuffle(ex).slice(0,12);
  if(!ex.length) return obStartFirst();
  G=newGame({id:'__place', title:'수준 확인', isReview:true, place:true}, ex);

  const pass = finished && (G.lost|0)<=2;

    LESSONS.forEach(l=>{

      if(u && OB.place.units.indexOf(u.id)>=0) S.done[l.id]=Math.max(S.done[l.id]||0, 1);

    OB.place.units.forEach(u=>{ if(!S.chest[u]) S.chest[u]=d; });
    if(typeof trackDone==='function' && S.doneAt)
      Object.keys(TRACKS).forEach(t=>{ if(trackDone(t) && !S.doneAt[t]) S.doneAt[t]=Date.now(); });
    S.xp+=50; addTodayXp(50); leagueBump(50);
    if(!S.firstDay) S.firstDay=d;
    bumpStreak();
  }
  save(); if(typeof CLOUD!=='undefined' && CLOUD.queue) CLOUD.queue();
  const first = pass ? (LESSONS.find(l=>!S.done[l.id]) || LESSONS[0]) : LESSONS[0];

      ? esc(OB.place.label)+' 건너뛰기 완료 · +50 XP'

function lsSkip(off){
  if(!G || G.answered) return;
  if(off){
    S.spkOff=Date.now()+3600e3; save();
    for(let k=G.queue.length-1;k>G.i;k--) if(G.queue[k].kind==='speak'){ G.queue.splice(k,1); G.total--; }
    toast('1시간 동안 말하기 문제를 빼 드릴게요');
  }
  G.answered=true; G.cleared++;
  next();
}
function bindSpeakEx(e){
  let tries=0, busy=false, rec=null;
  $('#lsOff').onclick=()=>{ sfx('tap'); lsSkip(true); };
  $('#lsMic').onclick=()=>{
    if(G.answered) return;
    if(busy){ try{ rec.stop(); }catch(_){} return; }
    try{ rec=new SRec(); }catch(_){ return lsSkip(true); }
    busy=true;
    rec.lang=SPEAK_LANG; rec.interimResults=false; rec.maxAlternatives=3;
    const btn=$('#lsMic'), hint=$('#lsHint');
    btn.classList.add('on'); hint.textContent='듣고 있어요… 말해 보세요';
    let got=false;
    rec.onresult=(ev)=>{
      got=true;
      const alts=[...ev.results[0]].map(r=>r.transcript);
      let bs=0; alts.forEach(t=>{ bs=Math.max(bs, simRatio(t, e.item.j)); });
      if(bs>=.6){ judge(true, e.item.j); return; }
      tries++; sfx('pair'); shakeScreen(false);
      if(tries>=2){ hint.textContent='괜찮아요 — 이번엔 넘어갈게요'; setTimeout(()=>lsSkip(false), 900); }
      else hint.textContent='일치도 '+Math.round(bs*100)+'% · 한 번 더 말해 보세요';
    };
    rec.onerror=(ev)=>{
      busy=false; btn.classList.remove('on');
      const c=ev&&ev.error;
      if(c==='not-allowed'||c==='service-not-allowed'){ hint.textContent='마이크가 막혀 있어요'; setTimeout(()=>lsSkip(true), 900); }
      else if(c==='no-speech') hint.textContent='소리가 안 들렸어요. 다시 눌러 주세요';
      else hint.textContent='다시 눌러 주세요';
    };
    rec.onend=()=>{
      busy=false; if(btn) btn.classList.remove('on');
      if(!got && hint && hint.textContent.indexOf('듣고')===0) hint.textContent='한 번 더 눌러 주세요';
    };
    try{ rec.start(); }catch(_){ busy=false; btn.classList.remove('on'); }
  };
}

const KANA_ITEMS = new Set(UNITS.filter(u=>u.kana).flatMap(u=>u.w||[]));
function optSayText(e, v){
  if(!e || e.kind!=='mcq' || !canSpeak()) return null;
  const it = e.item || {};
  let field = null;
  if(e.jpOpts) field='j';
  else if(it.k && e.answer===it.k) field='k';
  else if(it.m && e.answer===it.m && KANA_ITEMS.has(it)) field='m';
  if(!field) return null;
  const hit = ALL_WORDS.find(w=>w[field]===v) || ALL_SENT.find(w=>w[field]===v);
  if(hit){ if(field==='m' && !KANA_ITEMS.has(hit)) return null; return sayText({item:hit}); }
  if(field==='j') return String(v).replace(/\s*\(.*?\)\s*$/, '') || null;
  return null;
}
function optTap(e, b){
  const t = optSayText(e, b.dataset.v);
  if(t){
    speak(t);
    b.classList.remove('saying'); void b.offsetWidth; b.classList.add('saying');
  } else sfx('tap');
}

const HP_MAX=5, HP_MS=25*60*1000;   /* 25분마다 하트 하나가 돌아옵니다 */
const CHEST_XP=80;

function hpNow(){
  if(S.hp==null || S.hp>HP_MAX) S.hp=HP_MAX;
  if(S.hp>=HP_MAX){ if(S.hpAt){ S.hpAt=0; save(); } return HP_MAX; }
  if(!S.hpAt){ S.hpAt=Date.now(); save(); }
  const gain=Math.floor((Date.now()-S.hpAt)/HP_MS);
  if(gain>0){
    S.hp=Math.min(HP_MAX, S.hp+gain);
    S.hpAt = S.hp>=HP_MAX ? 0 : S.hpAt+gain*HP_MS;
    save();
  }
  return S.hp;
}
function hpSpend(){
  hpNow();
  if(S.hp>=HP_MAX) S.hpAt=Date.now();   /* 가득 찬 상태에서 처음 잃을 때부터 시간을 셉니다 */
  S.hp=Math.max(0, S.hp-1);
  save();
}
function hpGain(n){
  hpNow();
  S.hp=Math.min(HP_MAX, S.hp+(n|0));
  if(S.hp>=HP_MAX) S.hpAt=0;
  save();
}
/* 다음 하트까지 남은 분 */
function hpWaitMin(){
  if(hpNow()>=HP_MAX) return 0;

function dayKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

/* ---------------- 간격 반복 (라이트너 방식) ----------------
   맞히면 상자가 올라가고 다음 복습이 멀어집니다. 틀리면 1일 뒤로 되돌아갑니다.
   상자별 간격(일): 0일 → 1 → 3 → 7 → 21 → 60                          */
const KANA_W=UNITS.filter(u=>u.kana).flatMap(u=>u.w);
const VOCAB_W=UNITS.filter(u=>!u.kana).flatMap(u=>u.w);
const HIRA_W=KANA_W.filter(w=>/^[\u3041-\u309F]/.test(w.j));
const KATA_W=KANA_W.filter(w=>/^[\u30A0-\u30FF]/.test(w.j));
const KANA_SET=new Set(KANA_W.map(w=>w.j));
const isKana=it=>KANA_SET.has(it.j);
function poolFor(it){
  if(!isKana(it)) return VOCAB_W;
  return /^[\u30A0-\u30FF]/.test(it.j) ? KATA_W : HIRA_W;   // 문자 종류를 섞지 않습니다
}

const SRS_DAYS=[1,1,3,7,21,60];
const DAY=864e5;
function srsKey(it){ return it && it.j ? (it.t? 's:':'w:')+it.j : null; }
function srsTouch(it, ok){
  const k=srsKey(it); if(!k) return;
  const r=S.srs[k] || {b:0, d:0};
  r.b = ok ? Math.min(5, r.b+1) : 1;
  r.d = Date.now() + SRS_DAYS[r.b]*DAY;
  r.s = (r.s||0) + 1;
  S.srs[k]=r;
}
function srsLookup(k){
  const j=k.slice(2);
  return k[0]==='w' ? ALL_WORDS.find(w=>w.j===j) : ALL_SENT.find(x=>x.j===j);
}
function srsDue(){
  const now=Date.now(), out=[];
  for(const k in S.srs){ if(S.srs[k].d<=now){ const it=srsLookup(k); if(it) out.push(it); } }
  return out;
}
/* 다음 복습까지 남은 날 — 밀린 항목이 없을 때 안내용 */
function srsNextInDays(){
  const now=Date.now(); let best=Infinity;
  for(const k in S.srs){ const d=S.srs[k].d; if(d>now && d<best) best=d; }
  return best===Infinity ? null : Math.max(1, Math.ceil((best-now)/DAY));
}
function bumpStreak(){
  const t=dayKey(new Date());
  if(S.act.indexOf(t)<0){ S.act.push(t); if(S.act.length>120) S.act=S.act.slice(-120); }
  if(S.last===t) return;
  const ys=dayKey(new Date(Date.now()-864e5));
  /* 하루를 빠뜨렸어도 보호막이 있으면 한 번은 이어 줍니다 */
  if(S.last && S.last!==ys && (S.freeze|0)>0){ S.freeze--; S.fzAt=t; S.streak=(S.streak||0)+1; }
  else S.streak=(S.last===ys)? S.streak+1 : 1;
  S.last=t;
  STREAK_EVT={to:S.streak, fz:S.fzAt===t};
  setTimeout(streakGate, 0);
}

/* 날짜로 고정된 순서 — 같은 날에는 새로고침해도 같은 과제가 나옵니다 */
function questsToday(){
  const t=dayKey(new Date());
  if(S.quests && S.quests.d===t) return S.quests.list;
  let h=0; for(const ch of t) h=(h*31+ch.charCodeAt(0))>>>0;
  const rest=QUEST_POOL.filter(q=>q.id!=='lesson'&&q.id!=='xp');
  const pick=rest[h%rest.length];
  S.quests={d:t, list:[
    {id:'lesson', need:2,           prog:0, got:false},
    {id:'xp',     need:S.goal||260, prog:0, got:false},
    {id:pick.id,  need:pick.need,   prog:0, got:false}
  ]};
  save();
  return S.quests.list;
}
function questMeta(id){ return QUEST_POOL.find(q=>q.id===id)||{t:id,unit:''}; }
/* 진행도를 올리고, 새로 끝난 과제를 돌려줍니다 */
function questBump(id, n){
  const list=questsToday(); const out=[];
  list.forEach(q=>{
    if(q.id!==id || q.got) return;
    q.prog=Math.min(q.need, q.prog+n);
    if(q.prog>=q.need){ q.got=true; S.xp+=QUEST_XP; addTodayXp(QUEST_XP); S.gem=(S.gem|0)+10; out.push(q); }
  });
  if(out.length) save();
  return out;
}

/* 4 unique options; pools are tried in order so distractors stay near the lesson */
function opts4(correct, pools, keyfn){
  const seen=new Set([correct]); const out=[correct];
  for(const pool of pools){
    for(const c of shuffle(pool)){
      const v=keyfn(c);
      if(seen.has(v)) continue;
      seen.add(v); out.push(v);
      if(out.length===4) break;
    }
    if(out.length===4) break;
  }
  return shuffle(out);
}

/* ---------------- sound: synthesised, no files ---------------- */
const SND={ctx:null, master:null, sfxBus:null, musBus:null, timer:null, step:0, next:0};
function ac(){
  if(!SND.ctx){
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    try{ SND.ctx=new C(); }catch(e){ return null; }
    SND.master=SND.ctx.createGain(); SND.master.gain.value=.9; SND.master.connect(SND.ctx.destination);
    SND.sfxBus=SND.ctx.createGain(); SND.sfxBus.gain.value=.5; SND.sfxBus.connect(SND.master);
    SND.musBus=SND.ctx.createGain(); SND.musBus.gain.value=0; SND.musBus.connect(SND.master);
  }
  if(SND.ctx.state==='suspended') SND.ctx.resume().catch(()=>{});
  return SND.ctx;
}
function pluck(freq, at, dur, gain, type, bus){
  const c=SND.ctx; if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'triangle'; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(gain, at+.014);
  g.gain.exponentialRampToValueAtTime(.0001, at+dur);
  o.connect(g); g.connect(bus||SND.sfxBus);
  o.start(at); o.stop(at+dur+.06);
}
function noise(at, dur, gain){
  const c=SND.ctx; if(!c) return;
  const n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(); s.buffer=buf;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1600;
  const g=c.createGain(); g.gain.value=gain;
  s.connect(f); f.connect(g); g.connect(SND.sfxBus); s.start(at);
}
const YO=[261.63,293.66,349.23,392.00,440.00,523.25,587.33,698.46];  // 요나누키 음계
function sfx(name, lvl){
  if(!S.sfxOn) return;
  const c=ac(); if(!c) return;
  const t=c.currentTime;
  /* 연속으로 맞히면 같은 소리가 반음씩 올라갑니다 — 쌓이는 느낌이 납니다 */
  const up=Math.pow(2, Math.min(Math.max(lvl|0,0),8)/12);
  if(name==='correct'){
    pluck(YO[3]*up,t,.5,.3);pluck(YO[5]*up,t+.07,.55,.26);pluck(YO[7]*up,t+.14,.7,.2,'sine');
  } else if(name==='combo'){
    pluck(YO[3]*up,t,.4,.26);pluck(YO[5]*up,t+.06,.4,.24);pluck(YO[7]*up,t+.12,.5,.22);
    pluck(YO[7]*1.5*up,t+.2,.8,.16,'sine');pluck(YO[7]*2*up,t+.28,.9,.1,'sine');
  } else if(name==='wrong'){
    pluck(196,t,.32,.22,'sine');pluck(146.83,t+.1,.5,.2,'sine');noise(t,.08,.05);
  } else if(name==='heart'){
    pluck(330,t,.16,.18,'sine');pluck(220,t+.08,.3,.16,'sine');
  } else if(name==='tap'){
    pluck(880,t,.05,.07,'sine');
  } else if(name==='pair'){
    pluck(YO[5],t,.28,.2);pluck(YO[7],t+.05,.34,.16,'sine');
  } else if(name==='complete'){
    [0,3,5,7].forEach((n,i)=>pluck(YO[n],t+i*.13,.9,.28));
    pluck(YO[7]*2,t+.55,1.6,.14,'sine');
    for(let i=0;i<7;i++) pluck(YO[3+(i%5)]*2,t+.62+i*.055,.5,.07,'sine');
  } else if(name==='fail'){
    [7,5,3,0].forEach((n,i)=>pluck(YO[n]/2,t+i*.16,.7,.2,'sine'));
  } else if(name==='streak'){          // 콤보 고비를 넘었을 때
    [0,2,4,5].forEach((n,i)=>pluck(YO[n]*2,t+i*.05,.35,.15,'sine'));
  } else if(name==='lvlup'){           // 승급
    [0,2,4,7].forEach((n,i)=>pluck(YO[n],t+i*.1,1.1,.26));
    [0,4,7].forEach((n,i)=>pluck(YO[n]*2,t+.44+i*.09,1.3,.13,'sine'));
    for(let i=0;i<9;i++) pluck(YO[(3+i)%8]*2,t+.78+i*.05,.5,.055,'sine');
  } else if(name==='quest'){           // 오늘의 과제 완료
    pluck(YO[4],t,.3,.22);pluck(YO[7],t+.08,.45,.2,'sine');pluck(YO[7]*1.5,t+.16,.6,.12,'sine');
  } else if(name==='goal'){            // 하루 목표 달성
    [4,5,7].forEach((n,i)=>pluck(YO[n],t+i*.09,.7,.24));
    pluck(YO[7]*2,t+.34,1.1,.12,'sine');
  }

/* looping koto-ish background phrase */
const MEL=[0,2,4,2, 5,4,2,0, 1,3,5,3, 4,2,0,2];
function musicTick(){
  const c=SND.ctx; if(!c||!S.bgmOn) return;
  const now=c.currentTime;
  if(SND.next<now) SND.next=now+.06;
  while(SND.next<now+.5){
    const s=SND.step%16, at=SND.next;
    if(s%8===0) pluck(130.81,at,2.6,.2,'sine',SND.musBus);
    if(s%8===4) pluck(196,at,2.2,.16,'sine',SND.musBus);
    if(Math.random()>.16) pluck(YO[MEL[s]],at,1.2,.1,'triangle',SND.musBus);
    if(s%4===2) pluck(YO[MEL[s]]*2,at+.1,.7,.04,'sine',SND.musBus);
    SND.next+=.44; SND.step++;
  }
}
function setMusic(on){
  S.bgmOn=on; save();
  const c=ac(); if(!c) return;
  SND.musBus.gain.cancelScheduledValues(c.currentTime);
  SND.musBus.gain.linearRampToValueAtTime(on?.5:0, c.currentTime+(on?1.2:.5));
  if(on && !SND.timer){ SND.next=c.currentTime+.1; SND.timer=setInterval(musicTick,120); }

function fitCanvas(cv){

/* 바다 거품처럼 위로 떠오르는 방울 */
function petal(x,y){
  return {x, y, r:3+Math.random()*6, vy:-(.22+Math.random()*.4), vx:-.18+Math.random()*.36,
          a:Math.random()*6.28, va:(-.5+Math.random())*.02, sw:1, o:.14+Math.random()*.2};
}
function drawPetal(x,p){
  x.save(); x.translate(p.x,p.y);
  x.globalAlpha=p.o;
  x.beginPath(); x.arc(0,0,p.r,0,6.2832);
  x.fillStyle='#7FC3DC'; x.fill();
  x.lineWidth=1; x.strokeStyle='#4FA8C8'; x.globalAlpha=p.o*.8; x.stroke();
  x.globalAlpha=p.o*.9; x.fillStyle='#FFFFFF';
  x.beginPath(); x.arc(-p.r*.32,-p.r*.32,Math.max(1,p.r*.22),0,6.2832); x.fill();
  x.restore();
}
function petalsOn(){
  if(RM || !PET.x) return;
  if(!PET.p.length) for(let i=0;i<12;i++) PET.p.push(petal(Math.random()*PET.w, Math.random()*PET.h));
  if(PET.raf) return;
  const loop=()=>{
    const x=PET.x; x.clearRect(0,0,PET.w,PET.h);
    PET.p.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx+Math.sin(p.y/60)*.3; p.a+=p.va;
      if(p.y<-18){ p.y=PET.h+18; p.x=Math.random()*PET.w; }
      if(p.x<-20) p.x=PET.w+18; if(p.x>PET.w+20) p.x=-18;
      drawPetal(x,p);
    });
    PET.raf=requestAnimationFrame(loop);
  };
  loop();
}
function petalsOff(){
  if(PET.raf) cancelAnimationFrame(PET.raf);
  PET.raf=0;
  if(PET.x) PET.x.clearRect(0,0,innerWidth,innerHeight);
}
const CONF=['#D2452E','#23406E','#E0B34A','#F0A9B4','#4E9A72'];
function burst(cx,cy,n,power){
  if(RM || !FX.x) return;
  for(let i=0;i<n;i++){
    const a=-Math.PI/2 + (Math.random()-.5)*2.2, sp=(2.5+Math.random()*5)*(power||1);
    FX.p.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      w:4+Math.random()*7,h:3+Math.random()*6,c:CONF[(Math.random()*CONF.length)|0],
      a:Math.random()*6.28,va:(-.5+Math.random())*.35,life:1,round:Math.random()<.3});
  }
  fxLoop();
}
function fxLoop(){
  if(FX.raf) return;
  const step=()=>{
    const x=FX.x; x.clearRect(0,0,innerWidth,innerHeight);
    FX.p=FX.p.filter(p=>p.life>0);
    FX.p.forEach(p=>{
      p.vy+=.22; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.life-=.011;
      x.save(); x.translate(p.x,p.y); x.rotate(p.a);
      x.globalAlpha=Math.max(0,Math.min(1,p.life*1.6)); x.fillStyle=p.c;
      if(p.round){ x.beginPath(); x.arc(0,0,p.w/2,0,6.283); x.fill(); }
      else x.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      x.restore();
    });
    if(FX.p.length) FX.raf=requestAnimationFrame(step);
    else { FX.raf=0; x.clearRect(0,0,innerWidth,innerHeight); }
  };
  FX.raf=requestAnimationFrame(step);
}

/* ---------------- speech ---------------- */
const TTS = ('speechSynthesis' in window);
let EN_VOICE=null, VOICES_SEEN=false;
function loadVoices(){
  if(!TTS) return;
  const vs=speechSynthesis.getVoices()||[];
  if(!vs.length) return;
  VOICES_SEEN=true;
  const en=vs.filter(v=>v.lang&&v.lang.toLowerCase().indexOf('ko')===0);
  /* 미국 영어를 먼저 찾고, 없으면 아무 영어 목소리나 씁니다 */
  EN_VOICE = en.find(v=>/ko[-_]kr/i.test(v.lang)&&/google|yuna|sun-?hi|heami|injoon/i.test(v.name)) || en.find(v=>/ko[-_]kr/i.test(v.lang)) || en[0] || null;
}
if(TTS){ loadVoices(); speechSynthesis.addEventListener('voiceschanged', loadVoices); }

/* iOS·사파리는 사용자가 화면을 한 번 건드리기 전에는 소리를 내주지 않습니다.
   첫 터치 때 조용한 발화를 한 번 흘려보내 음성 엔진을 깨워 둡니다.        */
let TTS_WARM=false;
function warmTTS(){
  if(!TTS || TTS_WARM) return;
  TTS_WARM=true;
  try{
    loadVoices();
    const u=new SpeechSynthesisUtterance(' ');
    u.volume=0; u.lang='ko-KR';
    speechSynthesis.speak(u);
  }catch(e){}
}

let TTS_REAL=0, TTS_AT=0;
function speak(text, slow){
  if(!TTS||!text) return;
  try{
    warmTTS();
    /* 진짜 소리가 나는 중이거나 대기열이 막혀 있을 때만 끊습니다 */
    const busy = (TTS_REAL>0 && (Date.now()-TTS_AT)<15000) || speechSynthesis.pending;
    if(busy){ speechSynthesis.cancel(); TTS_REAL=0; }
    const go=()=>{
      try{
        const u=new SpeechSynthesisUtterance(text);
        u.lang='ko-KR'; u.rate= slow ? .62 : .88; u.pitch=1;
        if(EN_VOICE) u.voice=EN_VOICE;
        u.onend=u.onerror=()=>{ TTS_REAL=Math.max(0,TTS_REAL-1); };
        TTS_REAL++; TTS_AT=Date.now();
        speechSynthesis.speak(u);
      }catch(e){}
    };
    /* 사파리는 cancel 직후 바로 말하면 삼키는 일이 있어, 끊었을 때만 한 박자 둡니다 */
    if(busy) setTimeout(go, 60); else go();
  }catch(e){}
}
/* 스피커 버튼은 음성 기능만 있으면 보여 줍니다 */
const canSpeak = () => TTS;
/* 듣기 '문제'는 영어 목소리가 확인될 때만 냅니다 (iOS는 목록이 늦게 채워집니다) */
function audioOK(){ return TTS && (EN_VOICE || !VOICES_SEEN); }

/* ---------------- 4. EXERCISE BUILDER ---------------- */
/* 철자 문제로 낼 만한 단어: 한 낱말, 너무 길지 않은 것 */
const SPELLABLE=/^[A-Za-z][A-Za-z'-]{1,9}$/;

function mcqMeaning(it,W){ return {kind:'mcq', q:'뜻을 고르세요', jp:it.j, kana:it.k, audio:it.j,
  options:opts4(it.m, [W, ALL_WORDS], x=>x.m), answer:it.m, item:it}; }
function mcqWord(it,W){ return {kind:'mcq', q:'영어를 고르세요', ko:it.m, jpOpts:true,
  options:opts4(it.j, [W, ALL_WORDS], x=>x.j), answer:it.j, item:it}; }
function listenEx(it,W){ return {kind:'listen', q:'들리는 것을 고르세요', audio:it.j, jpOpts:true,
  options:opts4(it.j, [W, ALL_WORDS], x=>x.j), answer:it.j, item:it}; }
function typeEx(it){ return {kind:'type', q:'철자를 입력하세요', ko:it.m, hint:it.k, audio:it.j, answer:it.j, item:it}; }
function assembleEx(st){ return {kind:'assemble', q:'단어를 배열해 문장을 만드세요', ko:st.m, audio:st.j,
  tokens:scramble(st.t), answer:st.t.join(' '), item:st}; }
function sentMcq(st,SS){ return {kind:'mcq', q:'뜻을 고르세요', jp:st.j, kana:st.k, audio:st.j,
  options:opts4(st.m, [SS, ALL_SENT], x=>x.m), answer:st.m, item:st}; }
function scramble(t){
  if(t.length<2) return t.slice();
  let o=shuffle(t), g=0;
  while(o.join('|')===t.join('|') && g++<60) o=shuffle(t);
  return o;
}

function makeExercises(lesson){
  const ws=lesson.w, ss=lesson.s, ex=[];
  const W = UNITS[lesson.unit] ? UNITS[lesson.unit].w : ALL_WORDS;   // same-unit distractors
  const SS = UNITS[lesson.unit] ? UNITS[lesson.unit].s : ALL_SENT;
  const typable=ws.filter(w=>SPELLABLE.test(w.j));

  if(ss.length){
    shuffle(ss).forEach((st,i)=>{
      ex.push(assembleEx(st));
      if(i%2===0) ex.push(sentMcq(st,SS));
    });
    pick(typable, Math.min(2,typable.length)).forEach(w=>ex.push(typeEx(w)));
    if(audioOK()) pick(ws,2).forEach(w=>ex.push(listenEx(w,W)));
    if(lesson.review && ws.length>=5) ex.push({kind:'match', q:'짝을 맞추세요', pairs:pick(ws,5)});
  } else {
    shuffle(ws).forEach((it,i)=>{ ex.push(i%2 ? mcqWord(it,W) : mcqMeaning(it,W)); });
    if(ws.length>=5) ex.push({kind:'match', q:'짝을 맞추세요', pairs:pick(ws,5)});
    if(audioOK()) pick(ws,2).forEach(it=>ex.push(listenEx(it,W)));
    pick(typable, Math.min(3,typable.length)).forEach(it=>ex.push(typeEx(it)));
  }

  const match=ex.filter(e=>e.kind==='match');
  const rest=shuffle(ex.filter(e=>e.kind!=='match'));
  const cap=lesson.review?13:10;
  const out=rest.slice(0,cap-match.length);
  if(match.length) out.splice(Math.min(3,out.length),0,...match);
  return out;
}

/* ===== 진도 병합 =====
   두 기기에서 각각 학습한 결과를 합칩니다. 덮어쓰기가 아니라 합치기입니다.
   원칙: 어느 쪽에서든 한 번 이룬 진전은 사라지지 않는다. */

function dayNum(k){                       // 'YYYY-M-D' → 비교 가능한 숫자
  if(!k || typeof k!=='string') return -1;
  const p=k.split('-').map(Number);
  if(p.length!==3 || p.some(isNaN)) return -1;
  return p[0]*10000 + p[1]*100 + p[2];
}

function mergeProgress(a, b){
  if(!a) return b ? JSON.parse(JSON.stringify(b)) : null;
  if(!b) return JSON.parse(JSON.stringify(a));
  const out = {};

  // XP: 누적값이라 더하면 이중 계산이 됩니다. 더 많이 쌓인 쪽을 씁니다.
  out.xp = Math.max(a.xp|0, b.xp|0);

  // 놀이: 같은 놀이가면 별점이 높은 쪽
  out.done = Object.assign({}, a.done||{});
  const bd = b.done||{};
  for(const k in bd) out.done[k] = Math.max(out.done[k]|0, bd[k]|0);

  // 복습 일정: 항목별로 더 많이 익힌 쪽(상자가 높은 쪽).
  // 상자가 같으면 다음 복습이 더 뒤인 쪽 = 더 최근에 푼 쪽.
  out.srs = {};
  const as=a.srs||{}, bs=b.srs||{};
  for(const k of new Set([...Object.keys(as), ...Object.keys(bs)])){
    const x=as[k], y=bs[k];
    if(!x){ out.srs[k]=y; continue; }
    if(!y){ out.srs[k]=x; continue; }
    if((y.b|0) > (x.b|0)) out.srs[k]=y;
    else if((y.b|0) < (x.b|0)) out.srs[k]=x;
    else out.srs[k] = ((y.d|0) > (x.d|0)) ? y : x;
  }

  // 오답 노트: 합집합. 한쪽에서 틀렸으면 여전히 복습 대상입니다.
  out.mistakes = [...new Set([...(a.mistakes||[]), ...(b.mistakes||[])])];

  // 이미 본 문법 카드: 합집합
  out.seenG = Object.assign({}, a.seenG||{}, b.seenG||{});

  // 연속 학습일: 마지막 학습일이 더 뒤인 쪽의 기록을 따릅니다.
  // 같은 날이면 더 긴 쪽.
  const da=dayNum(a.last), db=dayNum(b.last);
  if(db > da){ out.last=b.last; out.streak=b.streak|0; }
  else if(da > db){ out.last=a.last; out.streak=a.streak|0; }
  else { out.last=a.last||b.last||null; out.streak=Math.max(a.streak|0, b.streak|0); }

  // 배지: 합집합. 먼저 얻은 날짜를 남깁니다.
  out.badges = Object.assign({}, b.badges||{}, a.badges||{});
  const bb=b.badges||{};
  for(const k in bb) if(!out.badges[k] || bb[k] < out.badges[k]) out.badges[k]=bb[k];

  // 공부한 날: 합집합 (최근 120일만)
  out.act = [...new Set([...(a.act||[]), ...(b.act||[])])].slice(-120);

  // 무결점 놀이 수 · 하루 목표: 더 큰 쪽 / 최근 쪽
  out.perfects = Math.max(a.perfects|0, b.perfects|0);
  out.goal = (db > da ? b.goal : a.goal) || a.goal || b.goal || 260;

  return out;
}

/* ===== 완주 =====
   트랙 하나를 끝냈을 때와 전부 끝냈을 때, 그냥 홈으로 돌려보내지 않습니다. */
const TRACK_NAME = {basic:'자음 모음 놀이', grammar:'글자 읽기 놀이'};
function trackDone(t){
  const ls=TRACKS[t]||[];
  return ls.length>0 && ls.every(l=>S.done[l.id]);
}
function allDone(){ return Object.keys(TRACKS).every(trackDone); }

/* 방금 끝낸 놀이로 새로 완주된 것이 있으면 그 이름을 돌려줍니다. */
function newlyFinished(){
  if(allDone() && !S.doneAt.all){ S.doneAt.all=Date.now(); save(); return 'all'; }
  for(const t of Object.keys(TRACKS))
    if(trackDone(t) && !S.doneAt[t]){ S.doneAt[t]=Date.now(); save(); return t; }
  return null;
}

function daysSince(){
  if(!S.firstDay) return null;
  const a=S.firstDay.split('-').map(Number);
  const d=Math.round((Date.now()-new Date(a[0],a[1]-1,a[2]).getTime())/864e5);
  return d<1?1:d;
}

const CLOUD = {

  emit(){ this.listeners.forEach(f=>{ try{ f(); }catch(e){} }); },
  set(st){ this.status=st; this.emit(); },

  /* 아티팩트처럼 외부 통신이 막힌 환경에서는 조용히 꺼진 채로 둡니다. */
  async init(){
    if(this.ready || this.status==='loading') return;
    this.status='loading';
    try{
      const [{initializeApp}, auth, fs] = await Promise.all([
        import(SDK+'firebase-app.js'),

      this.ready = true;
      this.set('restore');
      const giveUp = setTimeout(()=>{ if(this.status==='restore') this.set('out'); }, 8000);
      this.api.a.onAuthStateChanged(this.api.auth, async (u)=>{
        clearTimeout(giveUp);
        this.user = u;
        if(u){ await this.pull(); } else { this.set('out'); }
      });
    }catch(e){
      this.ready=false; this.set('off');       // 통신 불가 — 로컬 전용으로 계속
    }
  },

  idToEmail(id){ return String(id).trim().toLowerCase() + ID_DOMAIN; },
  nameOf(){ const e=this.user&&this.user.email||''; return e.replace(ID_DOMAIN,''); },

  async signUp(id, pw){
    const {createUserWithEmailAndPassword}=this.api.a;
    await createUserWithEmailAndPassword(this.api.auth, this.idToEmail(id), pw);

  },
  async signOut(){
    try{ await this.api.a.signOut(this.api.auth); }catch(e){}
    this.user=null; this.set('out');
  },

  doc(){ return this.api.f.doc(this.api.fs, 'progress_ko', this.user.uid); },

  /* 서버 진도를 가져와 지금 것과 합칩니다. 어느 쪽 진전도 잃지 않습니다. */
  async pull(){
    if(!this.user) return;
    this.set('sync');
    try{
      const snap = await this.api.f.getDoc(this.doc());
      const remote = snap.exists() ? (snap.data().data || null) : null;
      const merged = mergeProgress(snapshotOf(S), remote);
      if(merged) applyProgress(merged);
      await this.push(true);
      this.set('in');
    }catch(e){ this.set('err'); }
  },

  /* 저장은 몰아서 보냅니다 — 문제 하나 풀 때마다 보내지 않습니다. */
  queue(){
    if(!this.user || !this.ready) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(()=>this.push(), 1500);
  },
  async push(quiet){
    if(!this.user || !this.ready) return;
    if(!quiet) this.set('sync');
    try{
      await this.api.f.setDoc(this.doc(), { data: snapshotOf(S), at: Date.now() });
      if(!quiet) this.set('in');
    }catch(e){ this.set('err'); }
  }
};

/* 서버에 올리고 내리는 것은 진도뿐입니다 — 테마·소리 설정은 기기별로 둡니다. */
function snapshotOf(s){
  return { xp:s.xp|0, streak:s.streak|0, last:s.last||null,
           done:s.done||{}, mistakes:s.mistakes||[], srs:s.srs||{}, seenG:s.seenG||{},
           badges:s.badges||{}, act:s.act||[], perfects:s.perfects|0, goal:s.goal||260 };
}
function applyProgress(p){
  S.xp=p.xp|0; S.streak=p.streak|0; S.last=p.last||null;
  S.done=p.done||{}; S.mistakes=p.mistakes||[]; S.srs=p.srs||{}; S.seenG=p.seenG||{};
  if(p.badges) S.badges=p.badges;
  if(p.act) S.act=p.act;
  if(p.perfects!=null) S.perfects=p.perfects|0;
  if(p.goal) S.goal=p.goal;
  save();
}

/* ---------------- 진행 상황 백업 ----------------
   기기 간 자동 동기화는 이 환경에서 제공되지 않습니다.
   대신 진도 전체를 한 덩어리 코드로 뽑아 두었다가 다른 기기에서 되돌릴 수 있게 합니다. */
const BK_TAG='ENGLISHCAMP';
function b64enc(bytes){
  let s='';
  for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(str){
  const b=atob(str.replace(/-/g,'+').replace(/_/g,'/'));
  const out=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) out[i]=b.charCodeAt(i);
  return out;
}
async function makeBackup(){
  const payload={v:1, xp:S.xp, streak:S.streak, last:S.last, done:S.done,
                 mistakes:S.mistakes, srs:S.srs, seenG:S.seenG};
  const bytes=new TextEncoder().encode(JSON.stringify(payload));
  if(typeof CompressionStream==='function'){
    try{
      const buf=await new Response(new Blob([bytes]).stream()
        .pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      return BK_TAG+'Z'+b64enc(new Uint8Array(buf));
    }catch(e){}
  }
  return BK_TAG+'P'+b64enc(bytes);
}
async function readBackup(code){
  const t=String(code).trim().replace(/\s+/g,'');
  if(t.indexOf(BK_TAG)!==0) throw new Error('형식이 맞지 않습니다');
  const mode=t[BK_TAG.length], body=t.slice(BK_TAG.length+1);
  if(!body) throw new Error('내용이 비어 있습니다');
  let bytes;
  try{ bytes=b64dec(body); }catch(e){ throw new Error('코드가 손상되었습니다'); }
  if(mode==='Z'){
    if(typeof DecompressionStream!=='function') throw new Error('이 브라우저에서는 이 코드를 풀 수 없습니다');
    try{
      const buf=await new Response(new Blob([bytes]).stream()
        .pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
      bytes=new Uint8Array(buf);
    }catch(e){ throw new Error('코드가 손상되었습니다 — 일부만 복사되지 않았는지 확인해 주세요'); }
  } else if(mode!=='P') throw new Error('알 수 없는 형식입니다');
  let o;
  try{ o=JSON.parse(new TextDecoder().decode(bytes)); }
  catch(e){ throw new Error('코드가 손상되었습니다'); }
  if(!o || typeof o!=='object' || !o.done || typeof o.done!=='object') throw new Error('진행 정보를 찾을 수 없습니다');
  return o;
}
function backupStats(o){
  const lessons=Object.keys(o.done||{}).length;
  const items=Object.keys(o.srs||{}).length;
  return lessons+'개 놀이 · 복습 항목 '+items+'개 · XP '+(o.xp||0);
}

  app.innerHTML=shell(body, footer);
  midCheer();
  petalsOff();
  $('#quitBtn').onclick=confirmQuit;
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=ev=>{
    ev.preventDefault(); ev.stopPropagation();
    speak(b.dataset.say, b.dataset.slow==='1');
  });
  $('#fbBtn').onclick=next;

  if(e.kind==='mcq'||e.kind==='listen') bindOptions(e);
  else if(e.kind==='assemble') bindAssemble(e);
  else if(e.kind==='match') bindMatch(e);
  else if(e.kind==='type') bindType(e);
  else if(e.kind==='speak') bindSpeakEx(e);
  if(e.kind==='listen') setTimeout(()=>speak(e.audio), 380);
  if(e.dict) setTimeout(()=>speak(sayText(e)), 380);
  window.scrollTo(0,0);
}

function confirmQuit(){
  openSheet('놀이를 그만둘까요?','지금 나가면 이번 놀이의 진행 상황은 저장되지 않아요.',
    '계속 학습하기', closeSheet, '나가기', ()=>{ closeSheet(); renderHome(); });
}
function bindOptions(e){
  const chk=$('#check');
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(G.answered) return;
    app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); G.sel=b.dataset.v; chk.disabled=false;
    if(e.kind==='mcq') optTap(e, b); else sfx('tap');
  });
  chk.onclick=()=>judge(G.sel===e.answer, e.answer);
}
function bindAssemble(e){
  const line=$('#ansLine'), bank=$('#bank'), chk=$('#check');
  function paint(){
    line.innerHTML=G.built.map((b,i)=>`<button class="tok jp" data-back="${i}">${esc(b.t)}</button>`).join('');
    bank.querySelectorAll('.tok').forEach(t=>t.classList.toggle('ghost', G.built.some(b=>b.i===+t.dataset.i)));
    line.querySelectorAll('[data-back]').forEach(t=>t.onclick=()=>{
      if(G.answered) return;
      G.built.splice(+t.dataset.back,1); paint();
    });
    chk.disabled = G.built.length!==e.tokens.length;
  }
  bank.querySelectorAll('.tok').forEach(t=>t.onclick=()=>{
    if(G.answered||t.classList.contains('ghost')) return;
    const word=e.tokens[+t.dataset.i];
    speak(word);                       // 고른 낱말을 하나씩 들려줍니다
    G.built.push({i:+t.dataset.i, t:word}); paint();
  });
  paint();
  chk.onclick=()=>judge(G.built.map(b=>b.t).join(' ')===e.answer, e.answer);
}
function bindMatch(e){
  const ms=G.ms;
  app.querySelectorAll('.mcard').forEach(c=>c.onclick=()=>{
    if(G.answered||c.classList.contains('gone')) return;
    if(c.dataset.side==='l') speak(c.dataset.k);      // 영어 카드는 눌를 때마다 들려줍니다
    if(!ms.sel){ ms.sel=c; c.classList.add('sel'); return; }
    if(ms.sel===c){ c.classList.remove('sel'); ms.sel=null; return; }
    if(ms.sel.dataset.side===c.dataset.side){ ms.sel.classList.remove('sel'); ms.sel=c; c.classList.add('sel'); return; }
    if(ms.sel.dataset.k===c.dataset.k){
      const w=e.pairs.find(p=>p.j===c.dataset.k); if(w) speak(w.j);
      sfx('pair');
      const r=c.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 10, .6);
      const a=ms.sel; a.classList.remove('sel');
      a.classList.add('gone'); c.classList.add('gone'); ms.sel=null;
      ms.left--; $('#remain').textContent=ms.left;
      if(ms.left===0) setTimeout(()=>judge(ms.miss===0, null, ms.miss), 260);
    } else {
      ms.miss++; sfx('wrong');
      const a=ms.sel, b=c;
      a.classList.add('bad'); b.classList.add('bad');
      setTimeout(()=>{ a.classList.remove('bad','sel'); b.classList.remove('bad'); }, 420);
      ms.sel=null;
    }
  });
}

/* 철자 비교 — 대소문자와 앞뒤 공백은 무시합니다 */
const normSpell = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function bindType(e){
  const inp=$('#spell'), chk=$('#check');
  const paint=()=>{ G.typed=inp.value; chk.disabled=!inp.value.trim().length; };
  inp.addEventListener('input', paint);
  inp.addEventListener('keydown', ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); if(!chk.disabled && !G.answered) chk.click(); }
  });
  paint();
  setTimeout(()=>{ try{ inp.focus(); }catch(_){} }, 60);
  chk.onclick=()=>{
    inp.blur(); inp.disabled=true;
    judge(normSpell(G.typed)===normSpell(e.answer), e.answer);
  };
}

/* ---------------- 7. JUDGE + FEEDBACK ---------------- */
/* 이 문제에서 들려줄 영어 — 발음기호(k)가 아니라 영어 원문(j)입니다 */
function sayText(e){
  if(!e) return null;
  if(e.audio) return e.audio;
  if(e.item && e.item.j) return e.item.j;
  return null;
}
/* 피드백 줄에 붙는 작은 스피커 */
function fbSay(e){
  const t=sayText(e);
  return (t && canSpeak())
    ? ` <button class="fb-say" data-say="${esc(t)}" aria-label="정답 듣기">${ICON.sound}</button>`
     + `<button class="fb-say" data-say="${esc(t)}" data-slow="1" aria-label="정답 느리게 듣기">${ICON.turtle}</button>`
    : '';
}

function judge(ok, correct, missCount){
  if(G.answered) return;
  G.answered=true;
  const e=G.queue[G.i];

  if(e.kind==='mcq'||e.kind==='listen'){
    app.querySelectorAll('.opt').forEach(b=>{
      if(b.dataset.v===e.answer) b.classList.add('right');
      else if(b.classList.contains('sel')) b.classList.add('wrong');
      b.classList.remove('sel');
    });
  }

  const wasKnown = !!(e.item && S.srs[srsKey(e.item)]);   // 이미 익힌 항목 = 복습

  let gain=0;
  if(ok){
    G.cleared++; G.combo++; G.best=Math.max(G.best,G.combo);
    gain = 10 + (G.combo>=5?5:0) + (e.kind==='assemble'||e.kind==='type'?5:0);
    G.xp+=gain;
    sfx(G.combo>=5?'combo':'correct', G.combo-1);
    burst(innerWidth/2, innerHeight-130, G.combo>=5?46:28, G.combo>=5?1.25:1);
    xpPop(gain);
    comboCheer(G.combo);
    speak(sayText(e));
    if(!FREE_MODE){                       // 자유 복습은 일정을 앞당기지 않습니다
      if(e.item) srsTouch(e.item, true);
      if(e.kind==='match' && e.pairs) e.pairs.forEach(p=>srsTouch(p, true));
      if(e.item || e.pairs) save();
    }
    /* 오늘의 과제 진행 */
    const dn=[];
    if(e.kind==='listen') dn.push(...questBump('listen',1));
    if(e.item && e.item.t) dn.push(...questBump('sent',1));
    if(wasKnown) dn.push(...questBump('srs',1));
    const cq=(S.quests&&S.quests.list||[]).find(q=>q.id==='combo');
    if(cq && !cq.got && G.combo>cq.prog){
      cq.prog=Math.min(cq.need,G.combo);
      if(cq.prog>=cq.need){ cq.got=true; S.xp+=QUEST_XP; addTodayXp(QUEST_XP); S.gem=(S.gem|0)+10; dn.push(cq); }
      save();
    }
    if(dn.length) sfx('quest');
    dn.forEach(q=>toast('과제 완료 · '+questMeta(q.id).t+' <b>+'+QUEST_XP+' XP</b>'));
  } else {
    G.combo=0;
    sfx('wrong'); setTimeout(()=>sfx('heart'),160);
    shakeScreen(true); hitFlash();
    G.hearts=Math.max(0,G.hearts-1); G.lost=(G.lost|0)+1;
    if(!G.lesson.isReview) hpSpend();
    if(e.item){
      G.wrong.push(e.item);
      srsTouch(e.item, false);
      if(e.item.j && ALL_WORDS.some(w=>w.j===e.item.j) && S.mistakes.indexOf(e.item.j)<0){ S.mistakes.push(e.item.j); }
      save();
    }
    if(e.kind==='match' && e.pairs){
      e.pairs.forEach(p=>{ srsTouch(p,false); if(S.mistakes.indexOf(p.j)<0) S.mistakes.push(p.j); });
      save();
    }
    G.queue.push(e); G.total++;
    const hs=app.querySelectorAll('.hearts .h');
    if(hs[G.hearts]) hs[G.hearts].classList.add('off','pop');
  }

  const bar=app.querySelector('.bar>i'); if(bar) bar.style.width=Math.round(G.cleared/G.total*100)+'%';

  if(!ok) setTimeout(()=>speak(sayText(e)), 420);   // 틀렸을 때도 바른 소리를 한 번 들려줍니다

  const dead = G.hearts<=0;
  const fb=$('#fb'), btn=$('#fbBtn');
  $('#fbMark').innerHTML = `<div class="neko-${ok?'happy':'sad'}">${nekoHead(ok?'happy':'sad')}</div>
    <span class="fb-badge jp">${ok?'〇':'✕'}</span>`;
  fb.classList.add(ok?'ok':'no','show');
  const praise=['참 잘했어요!','최고예요!','멋져요!','딩동댕!','훌륭해요!'];
  if(ok){
    $('#fbTitle').textContent = praise[Math.floor(Math.random()*praise.length)];
    $('#fbBody').innerHTML = (e.item && e.item.m)
      ? `<b>${esc(e.item.j)}</b>${fbSay(e)}　${e.item.k&&e.item.k!==e.item.j?esc(e.item.k)+' · ':''}${esc(e.item.m)}`
      : '다섯 짝을 한 번에 모두 맞혔어요.';
    btn.className='cta shu';
  } else {
    $('#fbTitle').textContent='괜찮아요! 다시 해 봐요';
    $('#fbBody').innerHTML = e.kind==='match'
      ? `연결을 ${missCount}번 틀렸어요. 이 문제는 뒤에서 한 번 더 나옵니다.`
      : `정답: <b>${esc(correct||e.answer)}</b>${fbSay(e)}${(e.item&&e.item.m&&e.item.m!==(correct||e.answer))?`　${esc(e.item.m)}`:''}`;
    btn.className='cta';
  }
  fb.querySelectorAll('[data-say]').forEach(b2=>b2.onclick=ev=>{
    ev.preventDefault(); speak(b2.dataset.say, b2.dataset.slow==='1');
  });
  if(dead){ btn.textContent='결과 보기'; btn.onclick=renderFail; }
  else btn.textContent='계속하기';
  $('#mainFooter').style.visibility='hidden';
}
function next(){
  G.i++;
  if(G.i>=G.queue.length) renderResult();
  else renderExercise();
}

/* ---------------- 8. RESULT ---------------- */
function uniqWrong(){ return [...new Map(G.wrong.map(w=>[w.j,w])).values()].slice(0,5); }

function renderResult(){
  if(G.lesson.place) return renderPlaceResult(true);
  const acc=Math.round(G.cleared/G.total*100);
  const stars = (G.lost|0)===0?3 : (G.lost|0)<=2?2 : 1;
  const bonus = (G.lost|0)===0?15:0;
  const RS=resultStats();
  const boostX=boostOn()?2:1;
  const totalXP=(G.xp+bonus)*boostX;

  S.xp+=totalXP;
  if(!G.lesson.isReview) S.done[G.lesson.id]=Math.max(S.done[G.lesson.id]||0, stars);
  else if(G.lesson.id==='__review'){
    const stillWrong=new Set(G.wrong.map(w=>w.j));
    const asked=new Set(G.queue.map(q=>q.item&&q.item.j).filter(Boolean));
    S.mistakes=S.mistakes.filter(j=>!asked.has(j)||stillWrong.has(j));
  }
  /* 복습은 하트를 두 개 채워 줍니다 — 기다리는 대신 공부하게 만드는 길 */
  if(G.lesson.isReview) hpGain(2);
  if(!S.firstDay) S.firstDay=dayKey(new Date());
  bumpStreak();
  /* 7일마다 스트릭 보호막 하나 (최대 두 개) */
  let fzNew=false;
  if(S.streak>0 && S.streak%7===0 && (S.fzGot|0)!==S.streak && (S.freeze|0)<2){
    S.fzGot=S.streak; S.freeze=(S.freeze|0)+1; fzNew=true;
  }

  /* ---- 오늘 기록 · 과제 · 배지 ---- */
  const beforeBelt=beltOf(S.xp-totalXP).i;
  const wasUnder = todayXp() < (S.goal||260);
  addTodayXp(totalXP);
  leagueBump(totalXP);
  if((G.lost|0)===0) S.perfects=(S.perfects||0)+1;
  const doneQ=[
    ...questBump('lesson',1),
    ...questBump('xp',totalXP),
    ...((G.lost|0)===0 ? questBump('perfect',1) : [])
  ];
  const goalHit = wasUnder && todayXp() >= (S.goal||260);
  const gemGain = (G.lesson.isReview?3:5) + ((G.lost|0)===0 && !G.lesson.isReview?5:0) + (goalHit?10:0);
  S.gem=(S.gem|0)+gemGain;
  const newBadges = checkBadges();
  const beltUp = beltOf(S.xp).i > beforeBelt ? beltOf(S.xp) : null;
  save(); CLOUD.queue();
  const fin = G.lesson.isReview ? null : newlyFinished();
  if(!G.lesson.isReview) JUST_DONE=G.lesson.id;
  sfx('complete');
  if(fzNew) setTimeout(()=>toast('스트릭 보호막을 받았어요 · 하루 빠뜨려도 이어집니다'), 1500);
  setTimeout(()=>{ burst(innerWidth*.25, innerHeight*.45, 40, 1.3); }, 120);
  setTimeout(()=>{ burst(innerWidth*.75, innerHeight*.45, 40, 1.3); }, 330);
  setTimeout(()=>{ burst(innerWidth*.5, innerHeight*.35, 50, 1.5); }, 560);

  const nxt = fin ? null : nextLesson(G.lesson);
  const nxtLabel = !nxt ? ''
    : (nxt.unit!==G.lesson.unit ? '다음 단원 · '+UNITS[nxt.unit].title
                                : '다음 놀이 · '+nxt.title);
  const wl=uniqWrong();
  app.innerHTML=`
  <div class="center-screen">
    ${nekoBlock('cheer','合',146)}
    <h2>${esc(RS.title)}</h2>
    <p class="sub">${esc(G.lesson.title)} · ${bonus?'하나도 안 틀렸어요! 보너스 +15 XP':'꾸준함이 실력이 됩니다'}</p>
    <div class="scorecards">
      <div class="scard gold"><div class="h">획득 XP</div><div class="v">+${totalXP}</div></div>
      <div class="scard"><div class="h">${RS.tlab}</div><div class="v mono">${RS.time}</div></div>
      <div class="scard shu"><div class="h">${RS.alab}</div><div class="v">${acc}%</div></div>
    </div>
    <p class="sub gemline">${GEM_SVG}<b>+${gemGain}</b> 보석${boostX>1?' · <b>XP 2배</b> 적용':''}${G.best>=5?' · 최고 콤보 '+G.best:''}</p>
    ${goalHit?`<p class="sub win" style="margin-top:14px"><b>오늘 목표 ${S.goal||260} XP 달성.</b> 연속 ${S.streak}일째입니다.</p>`:''}
    ${beltUp?`<p class="sub win" style="margin-top:14px"><b>${beltUp.ko}${josaRo(beltUp.ko)} 올라섰습니다.</b> 누적 ${S.xp} XP.</p>`:''}
    ${doneQ.length?`<p class="sub" style="margin-top:14px">오늘의 과제 ${doneQ.length}개 완료 · <b>+${doneQ.length*QUEST_XP} XP</b></p>`:''}
    ${newBadges.length?`<div class="newbadges">${newBadges.map(b=>
      `<div class="badge on"><div class="bi jp">${b.g}</div><div class="bl">${esc(b.n)}</div></div>`).join('')}</div>
      <p class="sub">새 배지를 얻었습니다.</p>`:''}
    ${wl.length?`<div class="review"><h3>다시 볼 표현</h3><ul>${wl.map(w=>
      `<li><span class="j">${esc(w.j)}</span><span class="k">${esc(w.m)}</span></li>`).join('')}</ul></div>`:''}
    <div style="width:100%">${nxt
      ? `<button class="cta shu" id="nextBtn">${esc(nxtLabel)}</button>
         <button class="cta ghost" id="homeBtn" style="margin-top:10px">놀이 지도로</button>`
      : `<button class="cta shu" id="homeBtn">계속하기</button>`}</div>
    <button class="linkbtn" id="againBtn">이 놀이 다시 하기</button>
  </div>`;
  petalsOn();
  /* 완주 화면에서는 떠다니는 알약 대신 줄 자체를 도드라지게 — 캐릭터를 가리지 않습니다 */
  countUp(document.querySelector('.scard.gold .v'), totalXP, 950);
  if(beltUp) setTimeout(()=>{ sfx('lvlup');
    burst(innerWidth*.34, innerHeight*.46, 44, 1.5);
    setTimeout(()=>burst(innerWidth*.66, innerHeight*.46, 44, 1.5), 180); }, 950);
  else if(goalHit) setTimeout(()=>{ sfx('goal'); burst(innerWidth*.5, innerHeight*.5, 34, 1.2); }, 950);
  else if(doneQ.length) setTimeout(()=>sfx('quest'), 950);
  $('#homeBtn').onclick=()=>{ sfx('tap'); if(fin) renderFinish(fin); else renderHome(); };
  const nb=$('#nextBtn');
  if(nb) nb.onclick=()=>{ sfx('tap'); startLesson(nxt); };
  $('#againBtn').onclick=replay;
  window.scrollTo(0,0);
}
function renderFail(){
  if(G.lesson.place) return renderPlaceResult(false);
  sfx('fail');
  const wl=uniqWrong();
  app.innerHTML=`
  <div class="center-screen">
    ${nekoBlock('sad','再',132,true)}
    <h2>하트를 모두 잃었어요</h2>
    <p class="sub">${G.cleared}문제를 맞혔어요. ${hpNow()>0
      ? '하트 '+hpNow()+'개가 남아 있어요. 바로 다시 해도 됩니다.'
      : '하트가 다 떨어졌어요. '+hpWaitMin()+'분 뒤에 하나가 돌아오고,<br>복습을 한 번 끝내면 두 개가 바로 채워집니다.'}</p>
    ${wl.length?`<div class="review"><h3>이번에 놓친 표현</h3><ul>${wl.map(w=>
      `<li><span class="j">${esc(w.j)}</span><span class="k">${esc(w.m)}</span></li>`).join('')}</ul></div>`:''}
    <div style="width:100%">${hpNow()<=0 && refillWay()
      ? `<button class="cta shu" id="refillBtn">복습으로 하트 채우기</button><button class="cta ghost" id="retryBtn" style="margin-top:10px">다시 도전하기</button>`
      : `<button class="cta" id="retryBtn">다시 도전하기</button>`}</div>
    <button class="linkbtn" id="backBtn">학습 지도로 돌아가기</button>
  </div>`;
  petalsOff();
  $('#retryBtn').onclick=replay;
  const rf=$('#refillBtn'); if(rf) rf.onclick=()=>{ sfx('tap'); startRefill(); };
  $('#backBtn').onclick=()=>{ sfx('tap'); renderHome(); };
  window.scrollTo(0,0);
}
function replay(){
  if(G.lesson.place) return startPlacement();
  if(G.lesson.isReview){
    FREE_MODE=false;
    if(G.lesson.id==='__srs') startSrs();
    else if(G.lesson.id==='__free') startFree();
    else startReview();
  }
  else startLesson(LESSONS.find(l=>l.id===G.lesson.id));
}

/* 화면 위로 잠깐 떠오르는 알림 — 과제를 끝냈을 때 씁니다 */

  const el=document.createElement('div');
  el.className='toast'; el.innerHTML=html;

  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 350); }, 2600);
}

/* ---------------- 9. SHEET ---------------- */
function openSheet(title, text, primaryLabel, primaryFn, secondaryLabel, secondaryFn){
  closeSheet();
  const bg=document.createElement('div'); bg.className='sheet-bg'; bg.id='sheetBg';
  const sh=document.createElement('div'); sh.className='sheet'; sh.id='sheet';
  sh.innerHTML=`<h3>${esc(title)}</h3><p>${esc(text)}</p>
    <button class="cta shu" id="sheetP">${esc(primaryLabel)}</button>
    <button class="linkbtn" id="sheetS" style="width:100%">${esc(secondaryLabel)}</button>`;
  document.body.append(bg, sh);
  requestAnimationFrame(()=>sh.classList.add('show'));

function duPath(path){

    }
  });

    ev.stopPropagation(); sfx('tap');

  path.querySelectorAll('.node[data-lesson]').forEach(b=>{

function duSkipSheet(L){

    <div class="du-note">앞 놀이는 그대로 두고 이 놀이만 먼저 해 봅니다. 끝내면 다음 놀이도 열려요.</div>

  sh.querySelector('#duJump').onclick=()=>{ closeSheet(); sfx('tap'); startJump(L); };
  sh.querySelector('#duTry').onclick=()=>{ closeSheet(); sfx('tap'); startLesson(L); };
}
function startJump(L){
  if(!L) return renderHome();
  const t=duTrackOf(L), i=t.indexOf(L);
  let pool=t.slice(0,i).filter(l=>!S.done[l.id] && !l.review);
  if(!pool.length) pool=t.slice(0,i).filter(l=>!l.review);
  if(!pool.length) return startLesson(L);
  const n=Math.min(pool.length, 12), picked=[];
  for(let k=0;k<n;k++){ const x=pool[Math.round((pool.length-1)*(n===1?1:(k/(n-1))))]; if(picked.indexOf(x)<0) picked.push(x); }
  const per=Math.ceil(12/picked.length);
  let ex=[];
  picked.forEach(l=>{ try{ ex=ex.concat(shuffle(makeExercises(l).filter(e=>e.kind!=='match' && e.kind!=='speak')).slice(0,per)); }catch(_){} });
  ex=shuffle(ex).slice(0,12);
  if(!ex.length) return startLesson(L);
  G=newGame({id:'__jump', title:'건너뛰기 테스트', isReview:true, jump:L.id}, ex);
  G.hearts=3;
  renderExercise();
}
function duJumpResult(pass){
  const L=LESSONS.find(l=>l.id===G.lesson.jump);
  const d=dayKey(new Date());
  if(pass && L){
    const t=duTrackOf(L), i=t.indexOf(L);
    t.slice(0,i).forEach(l=>{ S.done[l.id]=Math.max(S.done[l.id]||0, 1); });
    S.chest=S.chest||{};
    UNITS.forEach(u=>{ if(u.lessons && u.lessons.every(l=>S.done[l.id]) && !S.chest[u.id]) S.chest[u.id]=d; });
    if(typeof trackDone==='function' && S.doneAt)
      Object.keys(TRACKS).forEach(k=>{ if(trackDone(k) && !S.doneAt[k]) S.doneAt[k]=Date.now(); });
    S.xp+=30; addTodayXp(30); if(typeof leagueBump==='function') leagueBump(30);
    if(!S.firstDay) S.firstDay=d;
    bumpStreak();
    save(); if(typeof CLOUD!=='undefined' && CLOUD.queue) CLOUD.queue();
  }
  sfx(pass?'complete':'fail');
  if(pass) setTimeout(()=>burst(innerWidth*.5, innerHeight*.4, 50, 1.4), 150);
  const u=L && UNITS[L.unit];
  app.innerHTML=`
  <div class="center-screen">
    ${nekoBlock(pass?'cheer':'idle', pass?'合':'', 146)}
    <h2>${pass?'건너뛰기 성공!':'아쉽게 통과하지 못했어요'}</h2>
    <p class="sub">${pass
      ? '앞 놀이를 모두 완료로 바꿨어요 · +30 XP'
      : '틀린 게 '+(G.lost|0)+'개예요. 다시 도전하거나, 테스트 없이 이 놀이만 먼저 해 볼 수 있어요.'}</p>
    <div style="width:100%">
      <button class="cta" id="jpGo">${esc((pass?'바로 시작 · ':'다시 도전하기'))}${pass&&L?esc((u?u.title+' ':'')+L.title):''}</button>
      ${pass?'':`<button class="cta ghost" id="jpTry" style="margin-top:12px">이 놀이만 해보기</button>`}
      <button class="linkbtn" id="jpHome" style="width:100%;margin-top:10px">놀이 지도로</button>
    </div>
  </div>`;
  $('#jpGo').onclick=()=>{ sfx('tap'); pass ? startLesson(L) : startJump(L); };
  const tr=$('#jpTry'); if(tr) tr.onclick=()=>{ sfx('tap'); startLesson(L); };
  $('#jpHome').onclick=()=>{ sfx('tap'); DU_TAB='learn'; if(L) JUST_DONE=L.id; renderHome(); };
  window.scrollTo(0,0);
}

/* ---- 보기 소리: 한국어 뜻 보기도 누르면 한국어로 읽어 줍니다 ----
   대상 언어 보기는 그 언어로, 한국어 보기는 한국어로. '들리는 것을 고르세요'만 조용히. */
let KO_VOICE=null;
function koVoice(){
  if(KO_VOICE || !TTS) return KO_VOICE;
  try{ KO_VOICE=(speechSynthesis.getVoices()||[]).find(v=>v.lang && v.lang.toLowerCase().indexOf('ko')===0)||null; }catch(_){}
  return KO_VOICE;
}
function speakKo(text){
  if(!TTS || !text) return;
  text=String(text).replace(/\s*\([^)]*\)\s*/g,' ').replace(/[~～]/g,'').trim();
  if(!text) return;
  try{
    warmTTS();
    const busy=(TTS_REAL>0 && (Date.now()-TTS_AT)<15000) || speechSynthesis.pending;
    if(busy){ speechSynthesis.cancel(); TTS_REAL=0; }
    const go=()=>{ try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='ko-KR'; u.rate=1; const v=koVoice(); if(v) u.voice=v;
      u.onend=u.onerror=()=>{ TTS_REAL=Math.max(0,TTS_REAL-1); };
      TTS_REAL++; TTS_AT=Date.now();
      speechSynthesis.speak(u);
    }catch(e){} };
    if(busy) setTimeout(go, 60); else go();
  }catch(e){}
}
optTap=function(e, b){

  if(e && e.kind==='mcq' && canSpeak() && /[가-힣]/.test(b.dataset.v||'')){ speakKo(b.dataset.v); bump(); return; }
  sfx('tap');
};

function fxUnitsDone(){ return UNITS.filter(u=>u.lessons && u.lessons.length && u.lessons.every(l=>S.done[l.id])); }
function fxCheck(quiet){
  const x=fxS(), t=dayKey(new Date()), out=[];
  if(S.quests && S.quests.d===t) x.q[t]=S.quests.list.filter(q=>q.got).length;
  x.maxSt=Math.max(x.maxSt|0, S.streak|0);
  /* 스티커 */
  const ud=fxUnitsDone();
  ud.forEach(u=>{ if(!x.stk[u.id]){ x.stk[u.id]=t; out.push({stk:u.id}); } });
  if(typeof STORIES!=='undefined') STORIES.forEach(s=>{ if(S.story && S.story[s.id] && !x.stk['s:'+s.id]){ x.stk['s:'+s.id]=t; out.push({stk:'s:'+s.id}); } });
  /* 조건 */
  const nU=ud.length, nS=Object.keys(S.story||{}).length, pf=S.perfects|0, st=x.maxSt, nL=Object.keys(S.done||{}).length;
  const qT=Object.values(x.q).reduce((a,b)=>a+(b|0),0);
  const trackAny=Object.keys(TRACKS).some(k=>(TRACKS[k]||[]).length && TRACKS[k].every(l=>S.done[l.id]));
  const nStk=Object.keys(x.stk).length, bd=S.badges||{}, lg=S.lg||{};
  const champ = !!(lg.lastWk && (lg.lastRank|0)===1);
  const R=[['c.fx',nU>=2],['c.pd',nS>=1],['c.tg',!!lg.on],['c.ow',!!bd.owl],
    ['f.sv',nU>=3],['f.gd',nU>=10],['f.fi',st>=7],['f.rw',st>=30],['f.sk',nS>=3],['f.pf',pf>=10],['f.lg',lg.lastMove==='up'],
    ['b.ss',qT>=10],['b.oc',nU>=5],['b.gl',trackAny],
    ['h.cp',nL>=1],['h.st',pf>=5],['h.fr',st>=14],['h.hp',x.spk>=3],['h.gr',trackAny],['h.cr',champ],
    ['t.sd',st>=7],['t.pf',pf>=10],['t.sy',nS>=5],['t.sp',x.spk>=5],['t.cl',nStk>=10],['t.ms',trackAny],['t.ch',champ],['t.ow',!!bd.owl],['t.ea',!!bd.lark]];
  R.forEach(([id,ok])=>{ if(ok && fxGrant(id)) out.push({item:id}); });
  /* 월간 챌린지 */
  const mk=fxMonthKey();
  if(!x.mon[mk] && fxMonthQuests()>=FX_MONTH_GOAL){
    x.mon[mk]=t; S.gem=(S.gem|0)+100;
    const m=new Date().getMonth()+1;
    ['f.m'+m,'t.mo'].forEach(id=>{ if(fxGrant(id)) out.push({item:id}); });
    const nm=Object.keys(x.mon).length;
    if(nm>=1 && fxGrant('h.pt')) out.push({item:'h.pt'});
    if(nm>=2 && fxGrant('c.dr')) out.push({item:'c.dr'});
    out.push({month:mk});
  }
  if(out.length){ save(); if(typeof CLOUD!=='undefined' && CLOUD.queue) CLOUD.queue(); }
  out.filter(o=>o.stk).slice(0,2).forEach(o=>{ const s=fxStk(o.stk); if(s) toast('스티커 획득 · '+s.e+' '+esc(s.n)); });
  const ni=out.filter(o=>o.item).length; if(ni && !quiet) setTimeout(()=>toast('새 꾸미기 아이템 '+ni+'개 · 프로필에서 확인'), 900);
  return out;
}

/* --- 따라 쓰기 --- */
const kD=(a,b)=>Math.hypot(a[0]-b[0], a[1]-b[1]);
function kLen(P){ let L=0; for(let i=1;i<P.length;i++) L+=kD(P[i-1],P[i]); return L; }
function kResample(P,n){
  const total=kLen(P); if(!total) return Array(n).fill(P[0]);
  const out=[]; let seg=1, acc=0;
  for(let k=0;k<n;k++){
    const t=total*k/(n-1);
    while(seg<P.length-1 && acc+kD(P[seg-1],P[seg])<t){ acc+=kD(P[seg-1],P[seg]); seg++; }
    const sl=kD(P[seg-1],P[seg])||1, r=Math.min(1, Math.max(0,(t-acc)/sl));
    out.push([P[seg-1][0]+(P[seg][0]-P[seg-1][0])*r, P[seg-1][1]+(P[seg][1]-P[seg-1][1])*r]);
  }
  return out;
}
function kSegD(p,a,b){
  const dx=b[0]-a[0], dy=b[1]-a[1], l=dx*dx+dy*dy;
  const t=l? Math.max(0, Math.min(1, ((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l)) : 0;
  return Math.hypot(p[0]-a[0]-t*dx, p[1]-a[1]-t*dy);
}
function kMinD(p,Q){ if(Q.length===1) return kD(p,Q[0]); let m=1e9; for(let i=1;i<Q.length;i++) m=Math.min(m, kSegD(p,Q[i-1],Q[i])); return m; }
function kArea(P){ let a=0; for(let i=1;i<P.length;i++) a+=P[i-1][0]*P[i][1]-P[i][0]*P[i-1][1]; return a; }
function kEval(user, ref, tol){
  const Lr=kLen(ref), Lu=kLen(user);
  if(Lr<16){
    const c=[user.reduce((s,p)=>s+p[0],0)/user.length, user.reduce((s,p)=>s+p[1],0)/user.length];
    const m=[(ref[0][0]+ref[ref.length-1][0])/2, (ref[0][1]+ref[ref.length-1][1])/2];
    return (kD(c,m)<tol*1.4 && Lu<Lr+tol*2.2) ? 'ok' : 'miss';
  }
  if(Lu<Lr*.42) return 'short';
  const us=kResample(user,32), rs=kResample(ref,32);
  const cov=rs.filter(p=>kMinD(p,user)<tol).length/rs.length;
  const stray=us.filter(p=>kMinD(p,ref)<tol*1.3).length/us.length;
  if(cov<.7 || stray<.7) return 'miss';
  if(kD(ref[0], ref[ref.length-1])<8){
    if(kArea(ref)*kArea(user)<0) return 'rev';
    return 'ok';
  }
  const dF=kD(us[0],rs[0])+kD(us[31],rs[31]), dR=kD(us[0],rs[31])+kD(us[31],rs[0]);
  return dR<dF ? 'rev' : 'ok';
}
const kPts=P=>P.map(p=>p[0]+','+p[1]).join(' ');

    if(plain || (lesson && lesson.kdrill)){
      const nb=app.querySelector('.center-screen .nekoblock');
      if(nb && !app.querySelector('.k-stamp')) nb.insertAdjacentHTML('beforeend', `<div class="k-stamp" aria-label="참 잘했어요 도장"><span>참</span><span>잘했어요</span></div>`);
    }
    if(fresh) setTimeout(()=>kStkReveal(fresh), 900);
    save();
  }catch(_){}
  return r;
};
function kStkReveal(emo){
  if(!app.querySelector('.center-screen')) return;
  document.querySelectorAll('.k-stkpop').forEach(x=>x.remove());
  const el=document.createElement('div'); el.className='k-stkpop'; el.setAttribute('role','dialog');
  el.innerHTML=`<div class="k-stkcard"><div class="h">칭찬 스티커를 받았어요!</div><div class="e">${emo}</div>
    <div class="s">스티커 도감에 붙여 두었어요</div><button class="cta shu" type="button">좋아요!</button></div>`;
  document.body.appendChild(el);
  sfx('quest');
  const close=()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 260); };
  el.querySelector('button').onclick=close;
  el.onclick=ev=>{ if(ev.target===el) close(); };
}

/* ---------- 7. 첫 화면 (온보딩) ---------- */
renderOnboard=function(step){
  step=step|0;
  if(step===0){
    app.innerHTML=`<div class="center-screen obhello">
      ${nekoBlock('cheer','',170)}
      <div class="obbubble">${esc(OB.hello)}</div>
      <p class="sub">처음에는 부모님과 함께 시작해 주세요.</p>
      <div style="width:100%"><button class="cta shu" id="obGo">시작하기</button>
      ${(typeof CLOUD!=='undefined' && CLOUD.status!=='off')?`<button class="cta ghost" id="obHave" style="margin-top:10px">이미 계정이 있어요</button>`:''}</div></div>`;
  } else if(step===1){
    const LV=[['🌱','처음이에요','자음과 모음부터 시작해요'],['🌿','자음·모음을 알아요','가 나 다 글자 읽기부터'],['🌳','글자를 조금 읽어요','그림 낱말부터']];
    app.innerHTML=obShell(0, `<h2 class="obq">한글을 얼마나 알고 있나요?</h2><p class="obnote" style="margin-top:-6px">부모님이 골라 주세요</p>
      <div class="obopts">${LV.map((w,i)=>`<button class="obopt" data-v="${i}"><span class="oi">${w[0]}</span><span class="ot">${esc(w[1])}<small>${esc(w[2])}</small></span></button>`).join('')}</div>`);
  } else {
    const TL=[[15,'15분'],[20,'20분'],[30,'30분'],[0,'정하지 않기']];
    app.innerHTML=obShell(1, `<h2 class="obq">하루 놀이 시간을 정할까요?</h2>
      <div class="obopts">${TL.map(([v,l])=>`<button class="obopt${v===20?' rec':''}" data-v="${v}"><span class="oi">${v?'⏰':'∞'}</span><span class="ot">${l}<small>${v?'시간이 다 되면 "오늘은 여기까지" 화면이 나와요':'언제든 부모님 화면에서 바꿀 수 있어요'}</small></span></button>`).join('')}</div>
      <p class="obnote">부모님 화면(🔒)에서 언제든 바꿀 수 있어요.</p>`);
  }
  petalsOff(); window.scrollTo(0,0);
  const bk=$('#obBack'); if(bk) bk.onclick=()=>{ sfx('tap'); renderOnboard(step-1); };
  const go=$('#obGo'); if(go) go.onclick=()=>{ sfx('tap'); renderOnboard(1); };
  const hv=$('#obHave'); if(hv) hv.onclick=()=>{ sfx('tap'); AUTH_MODE='in'; renderAuth(); };
  app.querySelectorAll('.obopt').forEach(b=>b.onclick=()=>{
    sfx('pair'); b.classList.add('sel'); const v=+b.dataset.v;
    setTimeout(()=>{
      if(step===1){ OBS.lv=v; renderOnboard(2); return; }
      S.kLimit=v; S.ob=2; S.goal=S.goal||120; save();
      const first = OBS.lv===2 ? 'w1-1' : OBS.lv===1 ? 's1-1' : 'v1-1';
      startLesson(LESSONS.find(l=>l.id===first)||LESSONS[0]);
      setTimeout(()=>mascotToast('틀려도 괜찮아! 같이 해 보자.'), 500);
    }, 180);
  });
};
mascotLine=function(){
  const due=srsDue().length, t=todayXp(), goal=S.goal||120;
  const L=['오늘도 한글 놀이 할까?','틀려도 괜찮아! 다시 하면 돼.','따라 쓰기를 하면 글씨가 쑥쑥 늘어요.','놀이를 끝내면 칭찬 스티커를 줄게!'];
  if(t>=goal) L.push('오늘 목표 끝! 정말 잘했어요.');
  if(due) L.push('다시 볼 글자가 '+due+'개 있어요.');
  if(S.streak>=2) L.push(S.streak+'일째 놀러 왔구나!');
  return L[Math.floor(Math.random()*L.length)];
};

/* ---------- 8. 놀이 시간 재기 · 하루 제한 ---------- */
const KT={act:Date.now()};
['pointerdown','keydown','touchstart'].forEach(n=>addEventListener(n, ()=>{ KT.act=Date.now(); }, {capture:true, passive:true}));
const kToday=()=>dayKey(new Date());
function kUsed(d){ return ((S.kw||{})[d||kToday()])|0; }
function kLimitSec(){
  const L=S.kLimit|0; if(!L) return 0;
  const x=S.kExtra && S.kExtra.d===kToday() ? S.kExtra.m : 0;
  if(x<0) return 0;
  return (L+x)*60;
}
const kOver=()=>{ const lim=kLimitSec(); return lim>0 && kUsed()>=lim; };
const kInPlay=()=>!!app.querySelector('.lessonbar');
function kTick(){
  if(document.visibilityState!=='visible' || Date.now()-KT.act>90000) return;
  const d=kToday(); S.kw=S.kw||{}; S.kw[d]=(S.kw[d]|0)+10;
  const ks=Object.keys(S.kw); if(ks.length>40){ ks.sort((a,b)=>new Date(a)-new Date(b)).slice(0, ks.length-40).forEach(k=>delete S.kw[k]); }
  save();
  if(kOver() && !kInPlay()) kLock();
}
setInterval(kTick, 10000);
function kLock(){
  if(document.getElementById('kLock')) return;
  try{ fxCloseAll(); }catch(_){}
  const el=document.createElement('div'); el.id='kLock'; el.className='k-lock'; el.setAttribute('role','dialog');
  el.innerHTML=`<div class="k-lockin">${nekoBlock('sleep','',150)}
    <h2>오늘 놀이 시간이 끝났어요</h2><p>호야도 이제 쉴 시간이에요.<br>내일 또 만나요! 🌙</p>
    <button class="cta ghost" type="button" id="kLockPar">🔒 부모님</button></div>`;
  document.body.appendChild(el);
  el.querySelector('#kLockPar').onclick=()=>kGate(()=>{
    document.body.classList.add('k-lockpar');
    openSheet('놀이 시간을 늘릴까요?', '오늘 '+Math.round(kUsed()/60)+'분 놀았어요.', '10분 더', ()=>{ closeSheet(); kExtend(10); }, '오늘은 제한 없이', ()=>{ closeSheet(); kExtend(-1); });
  });
}
function kExtend(m){
  const d=kToday();
  if(m<0) S.kExtra={d, m:-1};
  else { const cur=(S.kExtra && S.kExtra.d===d && S.kExtra.m>0)? S.kExtra.m : 0;
         const need=Math.max(0, Math.ceil(kUsed()/60)-(S.kLimit|0)); S.kExtra={d, m:Math.max(cur, need)+m}; }
  save();
  document.body.classList.remove('k-lockpar');
  const l=document.getElementById('kLock'); if(l) l.remove();
  toast(m<0?'오늘은 시간 제한 없이 놀아요':'10분 더 놀 수 있어요');
}
/* --- 부모님 확인 (곱셈 문제) --- */
function kGate(onOK){
  document.querySelectorAll('.k-gate').forEach(x=>x.remove());
  const a=6+Math.floor(Math.random()*4), b=12+Math.floor(Math.random()*8);
  const el=document.createElement('div'); el.className='k-gate'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
  el.innerHTML=`<form class="k-gatein" autocomplete="off"><h3>부모님 확인</h3><p>아래 문제의 답을 입력해 주세요.</p>
    <div class="k-gq mono">${a} × ${b} = ?</div>
    <input class="k-gi mono" id="kGi" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="답">
    <div class="k-gerr" id="kGerr"></div>
    <div class="k-gb"><button class="cta ghost" type="button" id="kGno">취소</button><button class="cta" type="submit">확인</button></div></form>`;
  document.body.appendChild(el);
  const inp=el.querySelector('#kGi');
  setTimeout(()=>{ try{ inp.focus(); }catch(_){} }, 60);
  el.querySelector('#kGno').onclick=()=>el.remove();
  el.querySelector('form').onsubmit=ev=>{
    ev.preventDefault();
    if(parseInt(inp.value,10)===a*b){ el.remove(); onOK(); }
    else { el.querySelector('#kGerr').textContent='답이 맞지 않아요'; inp.value=''; sfx('pair'); }
  };
}

/* ---------- 9. 부모님 화면 ---------- */
const K_LIMITS=[[15,'15분'],[20,'20분'],[30,'30분'],[0,'없음']];
function renderParent(){
  try{ fxCloseAll(); }catch(_){}
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(Date.now()-i*864e5); days.push({k:dayKey(d), l:'일월화수목금토'[d.getDay()], t:i===0}); }
  const mins=days.map(d=>Math.round(kUsed(d.k)/60)), mx=Math.max(10, ...mins);
  const lim=S.kLimit|0, todayM=Math.round(kUsed()/60), weekM=mins.reduce((a,b)=>a+b,0);
  const units=UNITS.map(u=>{ const n=u.lessons.filter(l=>S.done[l.id]).length; return {u, n, t:u.lessons.length}; });
  const miss=Object.entries(S.kmiss||{}).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([j,n])=>({it:ALL_WORDS.find(w=>w.j===j)||ALL_SENT.find(w=>w.j===j), j, n})).filter(x=>x.it);
  const spkOn=Date.now()>(S.spkOff||0);
  app.innerHTML=`
  <div class="topbar"><button class="iconbtn" id="kpBack" aria-label="돌아가기">${ICON.x}</button><div class="spacer"></div><b>부모님 화면</b><div class="spacer"></div><span style="width:40px"></span></div>
  <div class="k-par">
    <section class="k-pc"><h3>이번 주 놀이 시간</h3>
      <div class="k-pnum"><b>${todayM}</b>분 <small>오늘</small> · <b>${weekM}</b>분 <small>7일</small> · 연속 <b>${S.streak|0}</b>일</div>
      <div class="k-week">${days.map((d,i)=>`<div class="k-wd${d.t?' now':''}"><div class="k-wb"><i style="height:${Math.round(mins[i]/mx*100)}%"></i></div><div class="k-wv mono">${mins[i]}</div><div class="k-wl">${d.l}</div></div>`).join('')}</div>
    </section>
    <section class="k-pc"><h3>하루 놀이 시간 제한</h3>
      <div class="k-seg">${K_LIMITS.map(([v,l])=>`<button type="button" class="${lim===v?'on':''}" data-lim="${v}">${l}</button>`).join('')}</div>
      <p class="k-pnote">${lim? `오늘 ${todayM}분 / ${lim}분${S.kExtra&&S.kExtra.d===kToday()?(S.kExtra.m<0?' · 오늘은 제한 해제':' · 오늘 '+S.kExtra.m+'분 연장'):''}. 시간이 다 되면 놀이 중인 문제를 끝낸 뒤 "오늘은 여기까지" 화면이 나와요.` : '제한이 없어요.'}</p>
    </section>
    <section class="k-pc"><h3>단원별 진도</h3>
      ${units.map(x=>`<div class="k-urow"><span class="k-ug jp">${x.u.kanji}</span><div class="k-ub"><div class="k-ut">${esc(x.u.title)} <small>${esc(x.u.sub)}</small></div>
        <div class="k-up"><i style="width:${Math.round(x.n/x.t*100)}%"></i></div></div><span class="k-un mono">${x.n}/${x.t}</span></div>`).join('')}
    </section>
    <section class="k-pc"><h3>자주 헷갈리는 글자</h3>
      ${miss.length? `<div class="k-miss">${miss.map(x=>`<button type="button" class="k-mi" data-say="${esc(x.it.a||x.j)}"><span class="g jp">${esc(x.j.length>6?x.j.slice(0,6)+'…':x.j)}</span><span class="m">${esc(x.it.kind==='jamo'?x.it.m:(x.it.kind==='syl'?x.it.m:x.it.m))}</span><span class="n">${x.n}번</span></button>`).join('')}</div>
        <button class="cta shu" type="button" id="kDrill" style="margin-top:12px">이 글자들로 다시 놀기</button>`
      : '<p class="k-pnote">아직 없어요. 놀이를 하다가 틀린 글자가 여기에 모여요.</p>'}
    </section>
    <section class="k-pc"><h3>설정</h3>
      <div class="du-setrow"><span>말하기 문제 (마이크)</span><button type="button" class="du-sw${spkOn?' on':''}" id="kSpk">${spkOn?'켜짐':'꺼짐'}</button></div>
      <div class="du-setrow"><span>효과음</span><button type="button" class="du-sw${S.sfxOn?' on':''}" id="kSfx">${S.sfxOn?'켜짐':'꺼짐'}</button></div>
      <p class="k-pnote">기록은 이 기기에 저장돼요. 프로필에서 로그인하면 다른 기기와 이어 할 수 있어요. 광고와 결제가 없고, 보상은 놀이로만 얻어요.</p>
    </section>
  </div>`;
  petalsOff(); window.scrollTo(0,0);
  $('#kpBack').onclick=()=>{ sfx('tap'); renderHome(); };
  app.querySelectorAll('[data-lim]').forEach(b=>b.onclick=()=>{ sfx('tap'); S.kLimit=+b.dataset.lim; save(); renderParent(); });
  app.querySelectorAll('.k-mi[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const dr=$('#kDrill'); if(dr) dr.onclick=()=>{ sfx('tap'); kDrill(miss.map(x=>x.it)); };
  $('#kSpk').onclick=()=>{ S.spkOff = spkOn ? 9e15 : 0; save(); renderParent(); };
  $('#kSfx').onclick=()=>{ S.sfxOn=!S.sfxOn; save(); renderParent(); };
}
function kDrill(items){
  const ex=[];
  items.forEach(it=>{ ex.push(kQuizA(it)); ex.push(kQuizB(it)); });
  const q=shuffle(ex.filter(Boolean)).slice(0,10);
  if(!q.length) return renderHome();
  G=newGame({id:'__kdrill', title:'헷갈린 글자 다시 놀기', isReview:true, kdrill:true}, q);
  renderExercise();
}
function kOpenParent(){ kGate(renderParent); }

/* ---------- 10. 홈 화면 손질 ---------- */
const _kHome=renderHome;
renderHome=function(){
  const r=_kHome.apply(this, arguments);
  try{
    document.body.classList.remove('k-test');
    document.querySelectorAll('.k-stkpop').forEach(x=>x.remove());
    const top=app.querySelector('.topbar');
    if(top && !top.querySelector('#kParBtn')){
      top.insertAdjacentHTML('beforeend', `<button class="iconbtn k-parbtn" id="kParBtn" type="button" aria-label="부모님 화면">🔒</button>`);
      top.querySelector('#kParBtn').onclick=()=>{ sfx('tap'); kOpenParent(); };
    }
    const pr=app.querySelector('.du-profile');
    if(pr && !pr.querySelector('.k-parcard')){
      const set=pr.querySelector('.du-set');
      const html=`<button type="button" class="k-parcard" id="kParCard"><span class="i">👪</span><span class="t"><b>부모님 화면</b><small>놀이 시간 · 진도 · 헷갈리는 글자 · 시간 제한</small></span><span class="a">›</span></button>`;
      if(set) set.insertAdjacentHTML('beforebegin', html); else pr.insertAdjacentHTML('beforeend', html);
      pr.querySelector('#kParCard').onclick=()=>{ sfx('tap'); kOpenParent(); };
    }
    if(kOver()) setTimeout(()=>{ if(!kInPlay()) kLock(); }, 200);
  }catch(_){}
  return r;
};

/* 단원 설명(가이드북)은 부모님용 — 놀이 앞에 자동으로 띄우지 않습니다 */
const _kStartLesson=startLesson;
startLesson=function(lesson){ return _kStartLesson(lesson, true); };
